<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>投資日記</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/ionicons@7.4.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://cdn.jsdelivr.net/npm/ionicons@7.4.0/dist/ionicons/ionicons.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ════ HEADER ════ -->
<div id="hdr">
  <div class="hdr-left">
    <div class="hdr-breadcrumb">
      <span class="bc-link">投資日記</span>
      <span class="bc-sep" id="bc-sep" style="display:none"> / </span>
      <span class="bc-cur" id="bc-cur" style="display:none"></span>
    </div>
  </div>
  <div class="hdr-right">
    <span id="st1">載入中...</span>
    <span id="fugle-st" style="font-size:.75rem;color:#636366;white-space:nowrap">富果 檢測中...</span>
    <span class="hdr-fx">匯率 <b id="fx-rate-val">--</b></span>
    <button class="hdr-icon hdr-hide-sm" title="隱藏數字" onclick="toggleHide()">👁</button>
    <button class="btn-new" onclick="refresh()">⚡ 更新</button>
  </div>
</div>

<!-- ════ MAIN ════ -->
<div id="main">

  <!-- Portfolio Switcher -->
  <div class="port-switcher">
    <button class="ps on" id="pt-TW" onclick="setPortfolio('TW')">台股</button>
    <button class="ps"    id="pt-US" onclick="setPortfolio('US')">美股</button>
  </div>

  <!-- ═══ OVERVIEW PANEL ═══ -->
  <div class="panel on" id="panel-overview">

    <!-- Holdings Summary -->
    <div class="hs-card">
      <div class="hs-card-hdr">
        <div class="hs-card-title">Holdings Summary</div>
        <button class="hs-collapse" id="hs-toggle" onclick="toggleHsSummary()">∧</button>
      </div>
      <div class="hs-body" id="hs-body">
        <!-- LEFT: metrics -->
        <div class="hs-left">
          <div class="hs-nav" id="hs-nav">--</div>
          <div class="hs-nav-ntd" id="hs-nav-ntd"></div>

          <div class="hs-bar-section">
            <div class="hs-bar-track">
              <div class="hs-bar-fill" id="hs-bar" style="width:70%"></div>
            </div>
            <div class="hs-bar-labels">
              <div class="hs-bar-item">
                <div class="hs-dot blue"></div>
                <div>
                  <div class="lbl">Market Value</div>
                  <div class="val" id="hs-mv">--</div>
                </div>
              </div>
              <div class="hs-bar-item" style="flex-direction:row-reverse;text-align:right">
                <div class="hs-dot orange"></div>
                <div>
                  <div class="lbl">Cash</div>
                  <div class="val" id="hs-cash">--</div>
                </div>
              </div>
            </div>
          </div>

          <div class="hs-metrics">
            <div class="hs-mrow">
              <div class="hs-mlbl">Day Change <span class="hs-info" title="今日損益">i</span></div>
              <div class="hs-mval-wrap">
                <span class="hs-mval" id="hs-day-chg">--</span>
                <span class="hs-mpct" id="hs-day-pct"></span>
                <span class="hs-fx-equiv" id="hs-day-chg-ntd"></span>
              </div>
            </div>
            <div class="hs-mrow">
              <div class="hs-mlbl">Unrealized G/L <span class="hs-info" title="未實現損益">i</span></div>
              <div class="hs-mval-wrap">
                <span class="hs-mval" id="hs-unreal">--</span>
                <span class="hs-mpct" id="hs-unreal-pct"></span>
                <span class="hs-fx-equiv" id="hs-unreal-ntd"></span>
              </div>
            </div>
            <div class="hs-mrow">
              <div class="hs-mlbl">年化報酬率 <span class="hs-info" title="XIRR：今年以來，含買賣與已領現金股利">i</span></div>
              <div class="hs-mval-wrap">
                <span class="hs-mval" id="hs-xirr-ytd">--</span>
                <span class="hs-fx-equiv" id="hs-xirr-all"></span>
              </div>
            </div>
          </div>
        </div>

        <!-- RIGHT: chart -->
        <div class="hs-right">
          <div class="hs-info-bar" id="hs-info-bar">
            <span class="hs-ib-date" id="hs-ib-date"></span>
            <span class="hs-ib-nav" id="hs-ib-nav"></span>
            <span class="hs-ib-pnl" id="hs-ib-pnl"></span>
          </div>
          <div class="hs-chart-wrap">
            <div class="hs-periods">
              <button class="hs-period" onclick="hsSetPeriod('1M',this)">1M</button>
              <button class="hs-period" onclick="hsSetPeriod('6M',this)">6M</button>
              <button class="hs-period on" onclick="hsSetPeriod('YTD',this)">YTD</button>
              <button class="hs-period" onclick="hsSetPeriod('1Y',this)">1Y</button>
              <button class="hs-period" onclick="hsSetPeriod('ALL',this)">All</button>
              <span id="hs-bench-area" style="margin-left:auto;display:flex;gap:4px">
                <button class="hs-period" id="hs-bench-btn" onclick="toggleHsBench()">＋大盤</button>
              </span>
            </div>
            <canvas id="hsSummaryChart"></canvas>
          </div>
        </div>
      </div>
    </div>

    <!-- Holdings sortable table -->
    <div class="sc">
      <div class="sc-hdr">
        <div class="sc-title">持倉明細</div>
      </div>
      <div class="hld-tabs" style="margin-bottom:10px;margin-top:12px">
        <button class="hld-tab on" data-tab="today" onclick="switchHoldingsTab('today')">今日</button>
        <button class="hld-tab" data-tab="pnl" onclick="switchHoldingsTab('pnl')">損益</button>
        <button class="hld-tab" data-tab="alloc" onclick="switchHoldingsTab('alloc')">佔比</button>
        <button class="hld-tab" data-tab="trend" onclick="switchHoldingsTab('trend')">走勢</button>
      </div>
      <div class="hld-wrap">
        <table class="hld-tbl">
          <thead><tr id="hld-thead-row"></tr></thead>
          <tbody id="hld-body">
            <tr><td colspan="5" style="padding:14px 16px">
              <div class="skel" style="height:40px;margin-bottom:6px"></div>
              <div class="skel" style="height:40px;margin-bottom:6px;opacity:.7"></div>
              <div class="skel" style="height:40px;opacity:.5"></div>
            </td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div><!-- /panel-overview -->

  <!-- ═══ DIVIDENDS PANEL ═══ -->
  <div class="panel" id="panel-dividends">
    <div class="sc">
      <div class="sc-hdr">
        <div class="sc-title">股利紀錄</div>
        <div class="sc-btns" id="div-year-wrap"></div>
      </div>
      <div id="div-content">
        <div id="div-body" style="padding:6px 0 12px"></div>
      </div>
    </div>
  </div>

  <!-- ═══ LENDING PANEL ═══ -->
  <div class="panel" id="panel-lending">
    <div class="sc">
      <div class="sc-hdr"><div class="sc-title">借券收益</div></div>
      <div id="lending-metrics" class="mini-metrics"></div>
      <div id="lending-table" style="overflow-x:auto"></div>
    </div>
  </div>

  <!-- ═══ TRADE PANEL ═══ -->
  <div class="panel" id="panel-trade">
    <div class="sc">
      <div class="sc-hdr"><div class="sc-title">交易紀錄</div></div>
      <div class="trade-filters">
        <button class="tf on" onclick="setTradeFilter('all',this)">全部</button>
        <button class="tf" onclick="setTradeFilter('BUY',this)">買入</button>
        <button class="tf" onclick="setTradeFilter('SELL',this)">賣出</button>
        <button class="tf" onclick="setTradeFilter('TW',this)">台股</button>
        <button class="tf" onclick="setTradeFilter('US',this)">美股</button>
      </div>
      <div id="trade-list" style="padding:6px 0 12px"></div>
    </div>
  </div>

  <!-- ═══ CHARTS PAGE (多股圖) ═══ -->
  <div class="panel" id="panel-charts">
    <div class="sc">
      <div class="charts-pg-hdr">
        <div class="charts-pg-title">多股圖</div>
        <div class="cpt-wrap">
          <button class="cpt-btn on" data-p="daily"  onclick="setChartsPeriod('daily',this)">日K</button>
          <button class="cpt-btn"    data-p="weekly" onclick="setChartsPeriod('weekly',this)">周K</button>
        </div>
      </div>
      <div id="charts-grid-area" class="charts-grid"></div>
    </div>
  </div>

</div><!-- /#main -->

<script src="app.js"></script>

<!-- ════ BACK TO TOP ════ -->
<button id="back-top" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="回到頂部">↑</button>

<!-- ════ BOTTOM NAV ════ -->
<nav id="bottom-nav">
  <button class="bn on" id="bn-overview" onclick="sw('overview')">
    <ion-icon name="bar-chart-outline"></ion-icon>
    <span>總覽</span>
  </button>
  <button class="bn" id="bn-dividends" onclick="sw('dividends')">
    <ion-icon name="cash-outline"></ion-icon>
    <span>股利</span>
  </button>
  <button class="bn" id="bn-lending" onclick="sw('lending')">
    <svg viewBox="0 0 24 24"><path d="M3 21h18M3 10h18M5 6l7-3 7 3M4 10v11M20 10v11M8 10v11M16 10v11M12 10v11"/></svg>
    <span>借券</span>
  </button>
  <button class="bn" id="bn-trade" onclick="sw('trade')">
    <svg viewBox="0 0 24 24"><path d="M7 16V4m0 0L3 8m4-4 4 4M17 8v12m0 0 4-4m-4 4-4-4"/></svg>
    <span>交易</span>
  </button>
  <button class="bn" id="bn-charts" onclick="sw('charts')">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    <span>多股圖</span>
  </button>
</nav>
</body>
</html>
