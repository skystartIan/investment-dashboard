<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>投資日記</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--font:'Sora',sans-serif;--mono:'DM Mono',monospace;--r:14px;--r-sm:8px}
body.dark{--bg:#0d0f12;--surf:#161920;--surf2:#1e222d;--b:rgba(255,255,255,0.07);--b2:rgba(255,255,255,0.13);--t:#f0f2f5;--t2:#8b92a5;--t3:#4e5668;--green:#00c896;--gbg:rgba(0,200,150,0.1);--red:#ff5c6a;--rbg:rgba(255,92,106,0.1);--blue:#4d9fff;--btn:#1e222d;--shadow:none;--gc:rgba(255,255,255,0.04);--tc:#4e5668;--bc:rgba(255,255,255,0.07)}
body.light{--bg:#f4f6f9;--surf:#fff;--surf2:#f0f2f5;--b:rgba(0,0,0,0.07);--b2:rgba(0,0,0,0.12);--t:#1a1d24;--t2:#5a6278;--t3:#9ba3b5;--green:#00a876;--gbg:rgba(0,168,118,0.08);--red:#e03444;--rbg:rgba(224,52,68,0.08);--blue:#2b7de9;--btn:#f0f2f5;--shadow:0 1px 4px rgba(0,0,0,0.06);--gc:rgba(0,0,0,0.05);--tc:#9ba3b5;--bc:rgba(0,0,0,0.07)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--t);font-family:var(--font);font-size:15px;min-height:100vh;transition:background .25s,color .25s}
.header{padding:20px 20px 0;display:flex;justify-content:space-between;align-items:center}
.header-title{font-size:15px;font-weight:600;letter-spacing:.04em}
.header-date{font-family:var(--mono);font-size:12px;color:var(--t3)}
.header-right{display:flex;gap:8px;align-items:center}
.theme-toggle{width:40px;height:24px;background:var(--surf2);border:1px solid var(--b2);border-radius:12px;cursor:pointer;position:relative;flex-shrink:0}
.theme-toggle::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--t3);transition:transform .2s,background .2s}
body.light .theme-toggle::after{transform:translateX(16px);background:var(--green)}
.theme-label{font-size:11px;color:var(--t3)}
.hbtn{background:var(--btn);border:1px solid var(--b2);color:var(--t2);padding:7px 14px;border-radius:var(--r-sm);font-size:13px;cursor:pointer;font-family:var(--font);transition:all .2s}
.hbtn:hover{color:var(--t);border-color:var(--green)}
.nav{display:flex;gap:2px;padding:16px 20px 0;border-bottom:1px solid var(--b);overflow-x:auto}
.nav::-webkit-scrollbar{display:none}
.nav-item{padding:10px 18px;font-size:14px;cursor:pointer;color:var(--t2);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .2s;white-space:nowrap}
.nav-item:hover{color:var(--t)}
.nav-item.on{color:var(--green);border-bottom-color:var(--green);font-weight:500}
.panel{display:none;padding:20px}.panel.on{display:block}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px}
@media(min-width:640px){.metrics{grid-template-columns:repeat(4,1fr)}}
.mc{background:var(--surf);border:1px solid var(--b);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.mc-l{font-size:12px;color:var(--t3);letter-spacing:.04em;margin-bottom:7px}
.mc-v{font-family:var(--mono);font-size:22px;font-weight:500;line-height:1}
.mc-s{font-size:12px;margin-top:5px;color:var(--t3)}
.up{color:var(--green)!important}.dn{color:var(--red)!important}
.card{background:var(--surf);border:1px solid var(--b);border-radius:var(--r);padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.card-title{font-size:13px;color:var(--t2);margin-bottom:16px;letter-spacing:.04em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.chart-wrap{position:relative;width:100%}
.range-btns{display:flex;gap:4px;flex-wrap:wrap}
.rbtn{background:transparent;border:1px solid var(--b2);color:var(--t3);padding:4px 10px;border-radius:6px;font-size:12px;cursor:pointer;font-family:var(--font);transition:all .15s;white-space:nowrap}
.rbtn:hover{color:var(--t2)}
.rbtn.on{background:var(--gbg);border-color:var(--green);color:var(--green)}
.custom-row{display:none;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.custom-row.show{display:flex}
.custom-row input[type=date]{background:var(--surf2);border:1px solid var(--b2);color:var(--t);padding:6px 10px;border-radius:var(--r-sm);font-size:13px;font-family:var(--font);outline:none}
.custom-row label{font-size:12px;color:var(--t3)}
.legend-row{display:flex;gap:16px;margin-bottom:12px;flex-wrap:wrap}
.leg{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--t2)}
.leg-line{width:20px;height:3px;border-radius:2px;flex-shrink:0}
.pnl-list{display:flex;flex-direction:column;gap:12px}
.pnl-row{display:flex;flex-direction:column;gap:5px}
.pnl-top{display:flex;justify-content:space-between;align-items:baseline}
.pnl-name{font-size:14px;font-weight:500;color:var(--t)}
.pnl-pct{font-family:var(--mono);font-size:14px;font-weight:500}
.pnl-bar-bg{height:8px;background:var(--surf2);border-radius:4px;overflow:hidden}
.pnl-bar-fill{height:8px;border-radius:4px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.pnl-sub{font-size:12px;color:var(--t3);font-family:var(--mono)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:right;font-size:12px;font-weight:500;color:var(--t3);padding:8px 10px;border-bottom:1px solid var(--b);letter-spacing:.04em;white-space:nowrap}
th:first-child,th:nth-child(2){text-align:left}
td{padding:12px 10px;border-bottom:1px solid var(--b);text-align:right;font-family:var(--mono);font-size:13px;color:var(--t2);white-space:nowrap}
td:first-child{text-align:left;font-family:var(--font);font-weight:500;color:var(--t);font-size:14px}
td:nth-child(2){text-align:left;font-family:var(--font);color:var(--t2);font-size:13px}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surf2)}
.pie-leg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:16px}
@media(min-width:480px){.pie-leg{grid-template-columns:repeat(3,1fr)}}
.leg-item{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--t3)}
.leg-sq{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btn{background:var(--btn);border:1px solid var(--b2);color:var(--t2);padding:9px 18px;border-radius:var(--r-sm);font-size:14px;cursor:pointer;font-family:var(--font);transition:all .2s}
.btn:hover{color:var(--t)}
.btn-p{background:var(--gbg);border-color:var(--green);color:var(--green)}
.btn-p:hover{filter:brightness(1.1)}
.status{font-size:13px;color:var(--t3);margin-top:8px;min-height:18px;font-family:var(--mono)}
.status.ok{color:var(--green)}.status.err{color:var(--red)}
.prog{height:2px;background:var(--surf2);border-radius:1px;margin-top:6px;overflow:hidden}
.prog-bar{height:2px;background:var(--green);border-radius:1px;width:0%;transition:width .4s}
.fg{display:flex;flex-direction:column;gap:5px}
.fg label{font-size:12px;color:var(--t3);letter-spacing:.04em}
.fg input,.fg select{background:var(--surf2);border:1px solid var(--b2);color:var(--t);padding:10px 13px;border-radius:var(--r-sm);font-size:14px;font-family:var(--font);outline:none;transition:border-color .2s}
.fg input:focus,.fg select:focus{border-color:var(--green)}
.fg select option{background:var(--surf2)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.snap-item{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--b)}
.snap-item:last-child{border-bottom:none}
.snap-date{font-family:var(--mono);font-size:13px;color:var(--t3)}
.snap-val{font-family:var(--mono);font-size:14px;color:var(--t)}
.loading{text-align:center;padding:40px;color:var(--t3);font-size:14px}
.fetch-st{font-size:12px;color:var(--t3);margin:6px 0 10px;font-family:var(--mono);min-height:16px}
.twii-cb-wrap{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--t2);cursor:pointer}
.twii-cb-wrap input{accent-color:var(--blue);width:15px;height:15px;cursor:pointer}
</style>
</head>
<body class="dark">

<div class="header">
  <div>
    <div class="header-title">投資日記</div>
    <div class="header-date" id="hdate"></div>
  </div>
  <div class="header-right">
    <span class="theme-label" id="tlabel">暗色</span>
    <div class="theme-toggle" onclick="toggleTheme()"></div>
    <button class="hbtn" onclick="refresh()">↻ 更新</button>
  </div>
</div>

<div class="nav">
  <div class="nav-item on" onclick="sw('overview')">總覽</div>
  <div class="nav-item" onclick="sw('holdings')">持倉</div>
  <div class="nav-item" onclick="sw('history')">走勢</div>
  <div class="nav-item" onclick="sw('lending')">借貸</div>
  <div class="nav-item" onclick="sw('add')">更新</div>
</div>

<!-- 總覽 -->
<div class="panel on" id="panel-overview">
  <div class="metrics">
    <div class="mc"><div class="mc-l">台股市值</div><div class="mc-v" id="ov-tw">—</div><div class="mc-s" id="ov-tws"></div></div>
    <div class="mc"><div class="mc-l">未實現損益</div><div class="mc-v" id="ov-pnl">—</div><div class="mc-s" id="ov-pnls"></div></div>
    <div class="mc"><div class="mc-l">總成本</div><div class="mc-v" id="ov-cost">—</div><div class="mc-s" style="color:var(--t3)">TWD</div></div>
    <div class="mc"><div class="mc-l">報酬率</div><div class="mc-v" id="ov-ret">—</div><div class="mc-s" style="color:var(--t3)">整體</div></div>
  </div>
  <div class="card">
    <div class="card-title">個股損益</div>
    <div class="pnl-list" id="pnl-list"><div class="loading">載入中...</div></div>
  </div>
  <div class="btns">
    <button class="btn btn-p" onclick="doSnap()">存今日快照</button>
    <button class="btn" onclick="sw('add')">更新股價</button>
  </div>
  <div class="prog"><div class="prog-bar" id="prog1"></div></div>
  <div class="status" id="st1"></div>
</div>

<!-- 持倉 -->
<div class="panel" id="panel-holdings">
  <div class="card">
    <div class="card-title">市值配置</div>
    <div class="chart-wrap" style="height:260px"><canvas id="pieC" role="img" aria-label="市值配置"></canvas></div>
    <div class="pie-leg" id="pie-leg"></div>
  </div>
  <div class="tbl-wrap">
    <table>
      <thead><tr><th>代號</th><th>名稱</th><th>股數</th><th>均價</th><th>現價</th><th>損益%</th><th>市值(NT$)</th></tr></thead>
      <tbody id="h-body"><tr><td colspan="7" class="loading">載入中...</td></tr></tbody>
    </table>
  </div>
</div>

<!-- 走勢 -->
<div class="panel" id="panel-history">
  <div class="card">
    <div class="card-title">
      <span>資產走勢</span>
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
        <label class="twii-cb-wrap"><input type="checkbox" id="twii-cb" onchange="toggleTWII()"> 加權指數對照</label>
        <div class="range-btns">
          <button class="rbtn" data-r="MTD" onclick="setRange('MTD',this)">本月</button>
          <button class="rbtn" data-r="1" onclick="setRange(1,this)">1M</button>
          <button class="rbtn" data-r="3" onclick="setRange(3,this)">3M</button>
          <button class="rbtn" data-r="6" onclick="setRange(6,this)">6M</button>
          <button class="rbtn" data-r="YTD" onclick="setRange('YTD',this)">今年</button>
          <button class="rbtn" data-r="12" onclick="setRange(12,this)">1Y</button>
          <button class="rbtn on" data-r="0" onclick="setRange(0,this)">全部</button>
          <button class="rbtn" data-r="custom" onclick="setRange('custom',this)">自訂</button>
        </div>
      </div>
    </div>
    <div class="custom-row" id="customRow">
      <label>從</label><input type="date" id="dateFrom">
      <label>到</label><input type="date" id="dateTo">
      <button class="rbtn on" onclick="applyCustom()">套用</button>
    </div>
    <div class="fetch-st" id="fetch-st">尚未載入每日資料</div>
    <div class="legend-row" id="chart-legend">
      <div class="leg"><div class="leg-line" style="background:#00c896"></div>我的台股</div>
    </div>
    <div class="chart-wrap" style="height:320px"><canvas id="lineC" role="img" aria-label="資產走勢"></canvas></div>
  </div>
  <div id="snap-list"></div>
</div>

<!-- 借貸 -->
<div class="panel" id="panel-lending">
  <div class="metrics">
    <div class="mc"><div class="mc-l">借出股數</div><div class="mc-v" id="l-sh">—</div><div class="mc-s" style="color:var(--t3)">股</div></div>
    <div class="mc"><div class="mc-l">累計收入</div><div class="mc-v up" id="l-inc">—</div><div class="mc-s" style="color:var(--t3)">TWD</div></div>
    <div class="mc"><div class="mc-l">借貸市值</div><div class="mc-v" id="l-mv">—</div><div class="mc-s" style="color:var(--t3)">TWD</div></div>
    <div class="mc"><div class="mc-l">年化收益率</div><div class="mc-v up" id="l-rate">—</div><div class="mc-s" style="color:var(--t3)">估算</div></div>
  </div>
  <div class="card">
    <div class="card-title">借貸明細</div>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>代號</th><th>名稱</th><th>借出股數</th><th>借出日期</th><th>日費率%</th><th>累計收入(NT$)</th><th>市值(NT$)</th></tr></thead>
        <tbody id="lend-body"><tr><td colspan="7" style="text-align:left;padding:20px 10px;color:var(--t3);font-size:14px">尚無借貸記錄。</td></tr></tbody>
      </table>
    </div>
  </div>
  <div class="card">
    <div class="card-title">新增借貸記錄</div>
    <div class="form-grid">
      <div class="fg"><label>股票代號</label><input type="text" id="lc" placeholder="0050"></div>
      <div class="fg"><label>名稱</label><input type="text" id="ln" placeholder="元大台灣50"></div>
    </div>
    <div class="form-grid">
      <div class="fg"><label>借出股數</label><input type="number" id="ls" placeholder="1000"></div>
      <div class="fg"><label>借出日期</label><input type="date" id="ld"></div>
    </div>
    <div class="form-grid">
      <div class="fg"><label>日費率(%)</label><input type="number" id="lr" placeholder="0.05" step="0.001"></div>
      <div class="fg"><label>累計收入(NT$)</label><input type="number" id="li" placeholder="150"></div>
    </div>
    <div class="btns" style="margin-top:12px"><button class="btn btn-p" onclick="addLending()">新增借貸</button></div>
  </div>
  <div class="prog"><div class="prog-bar" id="prog3"></div></div>
  <div class="status" id="st3"></div>
</div>

<!-- 更新 -->
<div class="panel" id="panel-add">
  <div class="card">
    <div class="card-title">新增 / 更新持股</div>
    <div class="form-grid">
      <div class="fg"><label>股票代號</label><input type="text" id="ft" placeholder="0050 / 2330"></div>
      <div class="fg"><label>市場</label><select id="fm"><option value="TW">台股 TWD</option><option value="US">美股 USD</option></select></div>
    </div>
    <div class="form-grid">
      <div class="fg"><label>股數</label><input type="number" id="fs" placeholder="100"></div>
      <div class="fg"><label>平均成本</label><input type="number" id="fc" placeholder="450.00" step="0.01"></div>
    </div>
    <div class="form-grid">
      <div class="fg"><label>現價</label><input type="number" id="fp" placeholder="500.00" step="0.01"></div>
      <div class="fg"><label>名稱</label><input type="text" id="fn" placeholder="元大台灣50"></div>
    </div>
    <div class="btns" style="margin-top:12px"><button class="btn btn-p" onclick="addStock()">寫入 Sheets</button></div>
  </div>
  <div class="prog"><div class="prog-bar" id="prog2"></div></div>
  <div class="status" id="st2"></div>
</div>

<script>
const GAS='https://script.google.com/macros/s/AKfycbxs6SGJCCraFtTAfq9L_NMeL7fyvM_HnZ7HPklCJpoRNJemPacdBpXNuzRz0NuRKDLVQg/exec';
const FX=32.5;
const PIE_COLORS=['#00c896','#4d9fff','#ffaa44','#a78bfa','#f87171','#34d399','#fbbf24','#60a5fa','#f472b6','#2dd4bf','#fb923c','#818cf8','#4ade80','#e879f9','#38bdf8','#a3e635'];
const TW_SYMS=['0050.TW','1519.TW','1815.TW','2308.TW','2313.TW','2330.TW','2344.TW','2408.TW','3017.TW','3363.TW','3491.TW','3653.TW','6285.TW','6510.TW','8299.TW','8996.TW'];

let stockData=[], lendData=[], lineChart=null, pieChart=null;
let dailyPortfolio=[], twiiDaily=[], currentRange=0, showTWII=false;

// 月快照備用資料
const histMonthly=[
  ['2024-04-28',6046],['2024-06-28',26244],['2024-07-28',48189],['2024-08-28',60389],
  ['2024-09-28',83683],['2024-10-28',107450],['2024-11-28',128660],['2024-12-28',301413],
  ['2025-01-28',556642],['2025-02-28',633118],['2025-03-28',649152],['2025-04-28',593214],
  ['2025-05-28',644025],['2025-06-28',694689],['2025-07-28',495517],['2025-08-28',522935],
  ['2025-09-28',600255],['2025-10-28',535085],['2025-11-28',298451],['2025-12-28',521914],
  ['2026-01-28',1089450],['2026-02-28',1068155],['2026-03-28',1236292],
];

// Theme
(function(){
  const s=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  document.body.className=s;
  document.getElementById('tlabel').textContent=s==='dark'?'暗色':'亮色';
})();
function toggleTheme(){
  const d=document.body.classList.contains('dark');
  document.body.className=d?'light':'dark';
  document.getElementById('tlabel').textContent=d?'亮色':'暗色';
  localStorage.setItem('theme',d?'light':'dark');
  if(lineChart) redrawLine();
  if(pieChart) renderHoldings();
  renderPnlBars();
}

document.getElementById('hdate').textContent=new Date().toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric'});

function sw(id){
  document.querySelectorAll('.nav-item').forEach((t,i)=>{t.classList.toggle('on',['overview','holdings','history','lending','add'][i]===id);});
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  document.getElementById('panel-'+id).classList.add('on');
  if(id==='holdings'&&stockData.length) renderHoldings();
  if(id==='history') initHistory();
  if(id==='lending') renderLending();
}

async function gas(payload){
  const r=await fetch(GAS+'?t='+Date.now(),{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload)});
  if(!r.ok) throw new Error('連線失敗 '+r.status);
  const txt=await r.text();
  try{return JSON.parse(txt);}catch(e){throw new Error('回應格式錯誤');}
}

// ── 時間戳 → YYYY-MM-DD (台灣時區 UTC+8) ──
function tsToDate(ts){
  const d=new Date((ts+8*3600)*1000);
  const y=d.getUTCFullYear();
  const m=String(d.getUTCMonth()+1).padStart(2,'0');
  const dd=String(d.getUTCDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}

async function refresh(){
  const st=document.getElementById('st1'),pb=document.getElementById('prog1');
  st.textContent='讀取中...';st.className='status';pb.style.width='20%';
  try{
    const res=await gas({action:'read',sheet:'holdings'});
    if(!res.ok) throw new Error(res.error||'讀取失敗');
    stockData=res.data.slice(1).filter(r=>r[0]).map(r=>({code:String(r[0]),mkt:r[1],sh:+r[2],avg:+r[3],price:+r[4],name:r[5]||r[0]}));
    pb.style.width='100%';
    renderOverview();
    st.textContent='更新：'+new Date().toLocaleTimeString('zh-TW');
    st.className='status ok';
  }catch(e){st.textContent=e.message;st.className='status err';pb.style.width='0%';}
}

function pct(s){return(s.price-s.avg)/s.avg*100;}

function renderOverview(){
  let twV=0,twC=0;
  stockData.forEach(s=>{if(s.mkt==='TW'){twV+=s.sh*s.price;twC+=s.sh*s.avg;}});
  const pnl=twV-twC,pp=twC>0?pnl/twC*100:0,up=pnl>=0;
  document.getElementById('ov-tw').textContent='NT$'+Math.round(twV).toLocaleString();
  document.getElementById('ov-tws').textContent='≈ $'+Math.round(twV/FX).toLocaleString()+' USD';
  document.getElementById('ov-pnl').textContent=(up?'+':'-')+'NT$'+Math.abs(Math.round(pnl)).toLocaleString();
  document.getElementById('ov-pnl').className='mc-v '+(up?'up':'dn');
  document.getElementById('ov-pnls').textContent=(up?'+':'')+pp.toFixed(1)+'%';
  document.getElementById('ov-pnls').className=up?'up':'dn';
  document.getElementById('ov-cost').textContent='NT$'+Math.round(twC).toLocaleString();
  document.getElementById('ov-ret').textContent=(up?'+':'')+pp.toFixed(1)+'%';
  document.getElementById('ov-ret').className='mc-v '+(up?'up':'dn');
  renderPnlBars();
}

function renderPnlBars(){
  const tw=stockData.filter(s=>s.mkt==='TW').sort((a,b)=>pct(b)-pct(a));
  const maxAbs=Math.max(...tw.map(s=>Math.abs(pct(s))),1);
  const dark=document.body.classList.contains('dark');
  document.getElementById('pnl-list').innerHTML=tw.map(s=>{
    const p=pct(s),up=p>=0;
    const w=Math.abs(p)/maxAbs*100;
    const bc=up?(dark?'rgba(0,200,150,0.75)':'rgba(0,168,118,0.7)'):(dark?'rgba(255,92,106,0.75)':'rgba(224,52,68,0.7)');
    const gain=Math.round((s.price-s.avg)*s.sh);
    return`<div class="pnl-row">
      <div class="pnl-top">
        <div class="pnl-name">${s.name} <span style="font-size:12px;color:var(--t3);font-weight:400">${s.code}</span></div>
        <div class="pnl-pct ${up?'up':'dn'}">${up?'+':''}${p.toFixed(2)}%</div>
      </div>
      <div class="pnl-bar-bg"><div class="pnl-bar-fill" style="width:${w.toFixed(1)}%;background:${bc}"></div></div>
      <div class="pnl-sub">${s.sh.toLocaleString()}股 · 均${s.avg>=100?Math.round(s.avg):s.avg.toFixed(2)} → ${s.price>=100?s.price.toLocaleString():s.price.toFixed(2)} · ${up?'+':''}NT$${gain.toLocaleString()}</div>
    </div>`;
  }).join('');
}

function renderHoldings(){
  if(pieChart) pieChart.destroy();
  const tw=stockData.filter(s=>s.mkt==='TW').sort((a,b)=>b.sh*b.price-a.sh*a.price);
  const total=tw.reduce((s,x)=>s+x.sh*x.price,0);
  const dark=document.body.classList.contains('dark');
  pieChart=new Chart(document.getElementById('pieC'),{
    type:'doughnut',
    data:{labels:tw.map(s=>s.name),datasets:[{data:tw.map(s=>Math.round(s.sh*s.price)),backgroundColor:PIE_COLORS,borderWidth:2,borderColor:dark?'#161920':'#fff',hoverOffset:10}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'58%',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` NT$${Math.round(c.parsed).toLocaleString()} (${(c.parsed/total*100).toFixed(1)}%)`}}}}
  });
  document.getElementById('pie-leg').innerHTML=tw.map((s,i)=>`
    <div class="leg-item"><div class="leg-sq" style="background:${PIE_COLORS[i]}"></div>${s.name}
    <span style="color:var(--t2);font-family:var(--mono);margin-left:auto">${(s.sh*s.price/total*100).toFixed(1)}%</span></div>`).join('');
  document.getElementById('h-body').innerHTML=tw.map(s=>{
    const p=pct(s),up=p>=0;
    return`<tr><td>${s.code}</td><td>${s.name}</td><td>${s.sh.toLocaleString()}</td>
      <td>${s.avg>=100?Math.round(s.avg).toLocaleString():s.avg.toFixed(2)}</td>
      <td style="color:var(--t)">${s.price>=100?s.price.toLocaleString():s.price.toFixed(2)}</td>
      <td class="${up?'up':'dn'}">${up?'+':''}${p.toFixed(1)}%</td>
      <td>${Math.round(s.sh*s.price).toLocaleString()}</td></tr>`;
  }).join('');
}

// ── History ──
let historyInited=false;
async function initHistory(){
  // 先用月快照畫圖
  drawLine(histMonthly.map(h=>({d:h[0],tw:h[1]})));
  document.getElementById('snap-list').innerHTML=histMonthly.slice().reverse().map(h=>`
    <div class="snap-item"><span class="snap-date">${h[0]}</span><span class="snap-val">NT$${h[1].toLocaleString()}</span></div>`).join('');

  if(historyInited) return;
  historyInited=true;
  await fetchAllDaily();
}

async function fetchAllDaily(){
  const fst=document.getElementById('fetch-st');
  fst.textContent='正在抓取每日股價資料，請稍候（約 20 秒）...';
  const now=Math.floor(Date.now()/1000);
  const p1=Math.floor(new Date('2024-04-01').getTime()/1000);
  const allSyms=[...TW_SYMS,'^TWII'];

  try{
    const res=await gas({action:'yahoo_batch',symbols:allSyms,period1:p1,period2:now});
    if(!res.ok) throw new Error(res.error||'抓取失敗');
    const raw=res.data;

    // ── 解析大盤 ──
    const twiiRaw=raw['^TWII']||[];
    const twiiMap={};
    twiiRaw.forEach(([d,v])=>{ if(v) twiiMap[d]=v; });
    twiiDaily=twiiRaw.filter(([d,v])=>v!=null);

    // ── 解析持股每日價格 ──
    const priceMap={}; // code -> {date->price}
    TW_SYMS.forEach(sym=>{
      const code=sym.replace('.TW','');
      priceMap[code]={};
      (raw[sym]||[]).forEach(([d,v])=>{ if(v) priceMap[code][d]=v; });
    });

    // ── 建立每日日期集合 ──
    const dateSet=new Set();
    TW_SYMS.forEach(sym=>{
      const code=sym.replace('.TW','');
      Object.keys(priceMap[code]).forEach(d=>dateSet.add(d));
    });
    const allDates=[...dateSet].sort();

    if(!allDates.length) throw new Error('無法取得股價資料');

    // ── 計算每日組合市值 ──
    // 為每支股票建立「最近收盤價」lookup
    const latestPrice={}; // code -> price (rolling)
    const twStocks=stockData.filter(s=>s.mkt==='TW');

    // 初始化：用均價做預設
    twStocks.forEach(s=>{ latestPrice[s.code]=s.avg; });

    dailyPortfolio=[];
    allDates.forEach(d=>{
      // 更新當天有收盤價的股票
      twStocks.forEach(s=>{
        const p=priceMap[s.code][d];
        if(p) latestPrice[s.code]=p;
      });
      // 計算組合市值
      const total=twStocks.reduce((sum,s)=>sum+(s.sh*(latestPrice[s.code]||0)),0);
      if(total>0) dailyPortfolio.push({d,tw:Math.round(total)});
    });

    // ── 合併月快照（2024/04以前用月資料，之後用每日）──
    const dailyStart=dailyPortfolio.length?dailyPortfolio[0].d:'9999-99-99';
    const monthOnly=histMonthly.filter(h=>h[0]<dailyStart).map(h=>({d:h[0],tw:h[1]}));
    const merged=[...monthOnly,...dailyPortfolio].sort((a,b)=>a.d.localeCompare(b.d));

    fst.textContent=`每日資料載入完成 ✓（共 ${dailyPortfolio.length} 個交易日）`;

    // 更新快照清單
    document.getElementById('snap-list').innerHTML=[...merged].reverse().slice(0,20).map(r=>`
      <div class="snap-item"><span class="snap-date">${r.d}</span><span class="snap-val">NT$${r.tw.toLocaleString()}</span></div>`).join('');

    // 重畫圖表（套用目前選的時間範圍）
    currentData=merged;
    redrawLine();

  }catch(e){
    fst.textContent='每日資料抓取失敗：'+e.message+'（使用月快照）';
    currentData=histMonthly.map(h=>({d:h[0],tw:h[1]}));
    redrawLine();
  }
}

let currentData=histMonthly.map(h=>({d:h[0],tw:h[1]}));

function filterData(range){
  const now=new Date();
  let data=currentData;
  if(range==='MTD'){
    const s=new Date(now.getFullYear(),now.getMonth(),1).toISOString().slice(0,10);
    data=currentData.filter(r=>r.d>=s);
  } else if(range==='YTD'){
    const s=new Date(now.getFullYear(),0,1).toISOString().slice(0,10);
    data=currentData.filter(r=>r.d>=s);
  } else if(typeof range==='number'&&range>0){
    const c=new Date(); c.setMonth(c.getMonth()-range);
    const s=c.toISOString().slice(0,10);
    data=currentData.filter(r=>r.d>=s);
  }
  return data;
}

function setRange(range,btn){
  document.querySelectorAll('.rbtn[data-r]').forEach(b=>b.classList.remove('on'));
  if(btn) btn.classList.add('on');
  const cr=document.getElementById('customRow');
  if(range==='custom'){cr.classList.add('show');return;}
  cr.classList.remove('show');
  currentRange=range;
  redrawLine();
}

function applyCustom(){
  const from=document.getElementById('dateFrom').value;
  const to=document.getElementById('dateTo').value;
  if(!from||!to) return;
  const data=currentData.filter(r=>r.d>=from&&r.d<=to);
  drawLine(data);
}

function redrawLine(){drawLine(filterData(currentRange));}

function toggleTWII(){
  showTWII=document.getElementById('twii-cb').checked;
  const leg=document.getElementById('chart-legend');
  leg.innerHTML=`<div class="leg"><div class="leg-line" style="background:#00c896"></div>我的台股</div>`
    +(showTWII?`<div class="leg"><div class="leg-line" style="background:#4d9fff"></div>加權指數（右軸）</div>`:'');
  redrawLine();
}

function drawLine(rows){
  if(lineChart) lineChart.destroy();
  if(!rows||!rows.length) return;
  const dark=document.body.classList.contains('dark');
  const green=dark?'#00c896':'#00a876';
  const blue=dark?'#4d9fff':'#2b7de9';
  const many=rows.length>100;

  const datasets=[{
    label:'台股市值',
    data:rows.map(r=>({x:r.d,y:r.tw})),
    borderColor:green,
    backgroundColor:dark?'rgba(0,200,150,0.06)':'rgba(0,168,118,0.06)',
    tension:0.2,fill:true,
    pointRadius:many?0:3,pointHoverRadius:6,
    borderWidth:2,yAxisID:'y'
  }];

  const scales={
    x:{
      type:'category',
      ticks:{
        color:dark?'#4e5668':'#9ba3b5',font:{size:11},maxRotation:40,autoSkip:true,
        maxTicksLimit:10
      },
      grid:{display:false},
      border:{color:dark?'rgba(255,255,255,0.07)':'rgba(0,0,0,0.07)'}
    },
    y:{
      ticks:{color:dark?'#4e5668':'#9ba3b5',callback:v=>v>=1000000?'$'+(v/1000000).toFixed(1)+'M':'$'+(v/1000).toFixed(0)+'K',font:{size:11}},
      grid:{color:dark?'rgba(255,255,255,0.04)':'rgba(0,0,0,0.05)'},
      border:{color:dark?'rgba(255,255,255,0.07)':'rgba(0,0,0,0.07)'}
    }
  };

  // 加權指數
  if(showTWII&&twiiDaily.length){
    const twiiMap={};
    twiiDaily.forEach(([d,v])=>{twiiMap[d]=v;});
    // 用 forward-fill 對齊日期
    let lastTWII=null;
    const twiiData=rows.map(r=>{
      if(twiiMap[r.d]) lastTWII=twiiMap[r.d];
      return{x:r.d,y:lastTWII};
    });
    datasets.push({
      label:'加權指數',
      data:twiiData,
      borderColor:blue,
      backgroundColor:'transparent',
      tension:0.2,fill:false,
      pointRadius:0,pointHoverRadius:5,
      borderWidth:1.5,yAxisID:'y2'
    });
    scales.y2={
      position:'right',
      ticks:{color:dark?'#4e5668':'#9ba3b5',callback:v=>(v/1000).toFixed(0)+'K',font:{size:11}},
      grid:{display:false},
      border:{color:dark?'rgba(255,255,255,0.07)':'rgba(0,0,0,0.07)'}
    };
  }

  lineChart=new Chart(document.getElementById('lineC'),{
    type:'line',
    data:{datasets},
    options:{
      responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{display:false},
        tooltip:{callbacks:{
          title:items=>items[0].raw.x,
          label:c=>{
            if(c.dataset.yAxisID==='y2') return ` 加權：${Math.round(c.raw.y).toLocaleString()} 點`;
            return ` 台股：NT$${Math.round(c.raw.y).toLocaleString()}`;
          }
        }}
      },
      scales
    }
  });
}

// ── Snap ──
async function doSnap(){
  const st=document.getElementById('st1');
  if(!stockData.length){st.textContent='請先重新整理';st.className='status err';return;}
  let tw=0; stockData.forEach(s=>{if(s.mkt==='TW') tw+=s.sh*s.price;});
  const today=new Date().toISOString().slice(0,10);
  try{
    const res=await gas({action:'append',sheet:'snapshots',row:[today,+(tw/FX).toFixed(2),0,Math.round(tw)]});
    if(!res.ok) throw new Error(res.error);
    st.textContent='快照已儲存：'+today; st.className='status ok';
  }catch(e){st.textContent=e.message;st.className='status err';}
}

// ── Lending ──
function renderLending(){
  if(!lendData.length) return;
  let ts=0,ti=0,tmv=0;
  lendData.forEach(r=>{
    ts+=r.shares; ti+=r.income;
    const s=stockData.find(x=>x.code===r.code);
    if(s) tmv+=r.shares*s.price;
  });
  document.getElementById('l-sh').textContent=ts.toLocaleString();
  document.getElementById('l-inc').textContent='NT$'+Math.round(ti).toLocaleString();
  document.getElementById('l-mv').textContent=tmv?'NT$'+Math.round(tmv).toLocaleString():'—';
  const rate=tmv>0?(ti/tmv*365/30*100):0;
  document.getElementById('l-rate').textContent=rate>0?rate.toFixed(2)+'%':'—';
  document.getElementById('lend-body').innerHTML=lendData.map(r=>{
    const s=stockData.find(x=>x.code===r.code);
    const mv=s?Math.round(r.shares*s.price):0;
    return`<tr><td>${r.code}</td><td>${r.name}</td><td>${r.shares.toLocaleString()}</td>
      <td>${r.date}</td><td>${r.rate}</td>
      <td class="up">+${Math.round(r.income).toLocaleString()}</td>
      <td>${mv?mv.toLocaleString():'—'}</td></tr>`;
  }).join('');
}

async function addLending(){
  const st=document.getElementById('st3'),pb=document.getElementById('prog3');
  const code=(document.getElementById('lc').value||'').trim().toUpperCase();
  const name=document.getElementById('ln').value.trim()||code;
  const shares=+document.getElementById('ls').value;
  const date=document.getElementById('ld').value;
  const rate=document.getElementById('lr').value||'0';
  const income=+document.getElementById('li').value||0;
  if(!code||!shares||!date){st.textContent='請填寫代號、股數、日期';st.className='status err';return;}
  lendData.push({code,name,shares,date,rate,income});
  pb.style.width='50%';
  try{
    await gas({action:'append',sheet:'lending',row:[code,name,shares,date,rate,income]});
    pb.style.width='100%'; st.textContent='已新增 ✓'; st.className='status ok';
    ['lc','ln','ls','ld','lr','li'].forEach(id=>document.getElementById(id).value='');
    renderLending();
  }catch(e){pb.style.width='100%';st.textContent='新增失敗：'+e.message;st.className='status err';}
}

// ── Add stock ──
async function addStock(){
  const st=document.getElementById('st2'),pb=document.getElementById('prog2');
  const ticker=(document.getElementById('ft').value||'').trim().toUpperCase();
  const mkt=document.getElementById('fm').value;
  const sh=+document.getElementById('fs').value;
  const cost=+document.getElementById('fc').value;
  const price=+document.getElementById('fp').value;
  const name=document.getElementById('fn').value.trim()||ticker;
  if(!ticker||!sh||!cost||!price){st.textContent='請填寫所有欄位';st.className='status err';return;}
  st.textContent='讀取中...';pb.style.width='20%';
  try{
    const res=await gas({action:'read',sheet:'holdings'});
    if(!res.ok) throw new Error(res.error);
    let rows=res.data.length?res.data:[['ticker','market','shares','avg_cost','current_price','name']];
    const idx=rows.findIndex((r,i)=>i>0&&String(r[0])===ticker);
    if(idx>=0) rows[idx]=[ticker,mkt,sh,cost,price,name];
    else rows.push([ticker,mkt,sh,cost,price,name]);
    pb.style.width='60%';
    const res2=await gas({action:'write',sheet:'holdings',rows});
    if(!res2.ok) throw new Error(res2.error);
    pb.style.width='100%';
    st.textContent=ticker+' 已寫入 ✓'; st.className='status ok';
    ['ft','fs','fc','fp','fn'].forEach(id=>document.getElementById(id).value='');
    setTimeout(()=>refresh(),600);
  }catch(e){st.textContent=e.message;st.className='status err';pb.style.width='0%';}
}

// ── Init ──
async function init(){
  await refresh();
  try{
    const res=await gas({action:'read',sheet:'lending'});
    if(res.ok&&res.data.length>1){
      lendData=res.data.slice(1).filter(r=>r[0]).map(r=>({code:String(r[0]),name:r[1],shares:+r[2],date:r[3],rate:r[4],income:+r[5]||0}));
    }
  }catch(e){}
}
init();
</script>
