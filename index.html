<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>📖 投資日記</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ═══════════════════════════════════════════════
   CSS VARIABLES - BRIGHT VIVID THEME
═══════════════════════════════════════════════ */
:root {
  --bg:       #F5F0EB;
  --card:     #FDFCFA;
  --blue:     #7B8FA6;
  --blue2:    #9AAAB8;
  --green:    #7D9B8A;
  --red:      #B08080;
  --gold:     #C4A882;
  --violet:   #9B8EAC;
  --cyan:     #7EA8B0;
  --orange:   #C49678;
  --up:       #B08080;
  --dn:       #7D9B8A;
  --txt:      #3D3530;
  --txt2:     #6B6058;
  --txt3:     #8B7E74;
  --border:   #E5DDD5;
  --shadow:   0 4px 20px rgba(61,53,48,.08);
  --shadow2:  0 8px 32px rgba(61,53,48,.14);
  --r:        16px;
  --r-sm:     10px;
  --mono:     'Courier New', monospace;
}

/* ═══════════════════════════════════════════════
   ANIMATIONS
═══════════════════════════════════════════════ */
@keyframes fadeUp {
  from { opacity:0; transform:translateY(28px); }
  to   { opacity:1; transform:translateY(0); }
}
@keyframes slideIn {
  from { opacity:0; transform:translateX(-24px); }
  to   { opacity:1; transform:translateX(0); }
}
@keyframes pulse {
  0%,100% { box-shadow: 0 2px 12px rgba(61,53,48,.12); }
  50%      { box-shadow: 0 4px 20px rgba(61,53,48,.18); }
}
@keyframes glow {
  0%,100% { opacity: 1; }
  50%      { opacity: 0.82; }
}
@keyframes shimmer {
  0%   { background-position: -400px 0; }
  100% { background-position: 400px 0; }
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
@keyframes hdrMorandi {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
@keyframes numberPop {
  0%   { transform: scale(1); }
  50%  { transform: scale(1.08); }
  100% { transform: scale(1); }
}
@keyframes borderFlow {
  0%   { border-color: #7B8FA6; }
  33%  { border-color: #7D9B8A; }
  66%  { border-color: #C4A882; }
  100% { border-color: #7B8FA6; }
}

/* ═══════════════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════════════ */
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
html { font-size: 18px; }
body {
  font-family: -apple-system, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  background: var(--bg);
  color: var(--txt);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ═══════════════════════════════════════════════
   HEADER
═══════════════════════════════════════════════ */
#hdr {
  background: linear-gradient(135deg, #3A3530, #4E5564, #7B8FA6, #9B8EAC, #7D9B8A, #C4A882, #5E6E7F, #3A3530);
  background-size: 400% 400%;
  animation: hdrMorandi 16s ease infinite;
  color: #fff;
  padding: 20px 28px 16px;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 4px 32px rgba(0,85,255,.4);
}
#hdr-top { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; }
#hdr-title {
  font-size: 1.6rem; font-weight: 900; letter-spacing: -.5px;
  background: linear-gradient(90deg, #F5EDE4 0%, #D4C5B8 50%, #E8DDD5 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;

}
#hdate { font-size: 1rem; color: #C8BAB0; margin-top: 2px; }
#hdr-right { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.fx-pill {
  background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3);
  border-radius: 20px; padding: 5px 14px; font-size: .85rem; color:#fff;
  backdrop-filter: blur(8px);
}
#fx-rate-val { font-weight:800; color:#E8DDD5; }
.btn-refresh {
  background: linear-gradient(135deg, #7B8FA6, #9B8EAC);
  color:#fff; border:none; border-radius: 24px; padding: 10px 22px;
  font-size: .9rem; font-weight:700; cursor:pointer;
  transition: all .25s;
  white-space: nowrap;
}
.btn-refresh:hover { transform:scale(1.04); box-shadow: 0 4px 16px rgba(61,53,48,.22); }
#st1 { font-size:.85rem; color:#93C5FD; }
#st1.ok  { color:#A8C5B5; }
#st1.err { color:#C4A0A0; }
#prog1-wrap { height:3px; background:rgba(255,255,255,.15); border-radius:2px; margin-top:8px; }
#prog1 { height:100%; width:0%; background:linear-gradient(90deg,#7D9B8A,#7B8FA6,#9B8EAC); border-radius:2px; transition:width .4s; }

/* ═══════════════════════════════════════════════
   MARKET TOGGLE
═══════════════════════════════════════════════ */
#mkt-wrap {
  display:flex; align-items:center; gap:0;
  background:#FDFCFA; border-radius: 28px; padding:4px;
  box-shadow: var(--shadow); border: 2px solid #E5DDD5;
  margin: 18px 20px 0;
  width: fit-content;
}
.mkt-btn {
  border:none; border-radius:22px; padding: 10px 26px;
  font-size: 1rem; font-weight:700; cursor:pointer;
  background:transparent; color: var(--txt2);
  transition: all .22s;
}
.mkt-btn.on {
  background: linear-gradient(135deg, #7B8FA6, #9B8EAC);
  color: #fff;
  box-shadow: 0 3px 16px rgba(0,85,255,.35);
  transform: scale(1.04);
}

/* ═══════════════════════════════════════════════
   NAVIGATION TABS
═══════════════════════════════════════════════ */
#nav {
  display:flex; gap:0; overflow-x:auto;
  background:#FDFCFA; margin: 14px 20px 0;
  border-radius: var(--r) var(--r) 0 0;
  border: 2px solid #E5DDD5; border-bottom:none;
  box-shadow: var(--shadow);
}
.nav-item {
  flex: 1; min-width: 80px; text-align:center;
  padding: 14px 8px; font-size: .95rem; font-weight:700;
  cursor:pointer; color: var(--txt2);
  border-bottom: 3px solid transparent;
  transition: all .22s; white-space:nowrap;
}
.nav-item:hover { background:#EDE8E2; color: var(--blue); }
.nav-item.on {
  color: var(--blue);
  border-bottom-color: var(--blue);
  background: linear-gradient(180deg, #EDE8E2 0%, #FDFCFA 100%);
}

/* ═══════════════════════════════════════════════
   PANELS
═══════════════════════════════════════════════ */
.panel {
  display:none;
  background:#FDFCFA; border: 2px solid #E5DDD5; border-top:none;
  border-radius: 0 0 var(--r) var(--r);
  margin: 0 20px 24px;
  box-shadow: var(--shadow);
  min-height: 400px;
  animation: fadeUp .35s ease;
}
.panel.on { display:block; }
.panel-inner { padding: 24px; }

/* ═══════════════════════════════════════════════
   METRIC CARDS
═══════════════════════════════════════════════ */
.metrics-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}
.mc {
  background: #FDFCFA;
  border: 1px solid #E5DDD5;
  border-radius: var(--r);
  padding: 20px 22px;
  position: relative; overflow: hidden;
  transition: transform .22s, box-shadow .22s;
  animation: fadeUp .4s ease both;
}
.mc:hover { transform: translateY(-4px); box-shadow: var(--shadow2); }
.mc::before {
  content:''; position:absolute; top:0; left:0; right:0; height:4px;
  border-radius: var(--r) var(--r) 0 0;
}
.mc.blue::before   { background: linear-gradient(90deg, #7B8FA6, #9AAAB8); }
.mc.green::before  { background: linear-gradient(90deg, #7D9B8A, #7EA8B0); }
.mc.gold::before   { background: linear-gradient(90deg, #C4A882, #D4BC9A); }
.mc.violet::before { background: linear-gradient(90deg, #9B8EAC, #B09BAC); }
.mc.red::before    { background: linear-gradient(90deg, #B08080, #C49678); }
.mc-label { font-size: .85rem; font-weight:700; color: var(--txt2); text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px; }
.mc-v { font-size: 1.9rem; font-weight:900; color: var(--txt); font-family: var(--mono); line-height:1.1; }
.mc-sub { font-size: .95rem; font-weight:600; margin-top:4px; }
.up { color: var(--up) !important; }
.dn { color: var(--dn) !important; }

/* ═══════════════════════════════════════════════
   STOCK TABLE
═══════════════════════════════════════════════ */
.section-title {
  font-size: 1.15rem; font-weight:800; color: var(--txt);
  margin-bottom: 14px; padding-bottom: 10px;
  border-bottom: 1px solid #E5DDD5;
  display:flex; align-items:center; gap:8px;
}
.sort-wrap { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
.sort-btn {
  border:1px solid #E5DDD5; border-radius:20px;
  padding: 7px 16px; font-size:.9rem; font-weight:700;
  cursor:pointer; background:#FDFCFA; color: var(--txt2);
  transition:all .2s;
}
.sort-btn.on, .sort-btn:hover {
  background: var(--blue); color:#fff; border-color:var(--blue);
}
#pnl-list { display:flex; flex-direction:column; gap:10px; }
.stock-row {
  display:grid;
  grid-template-columns: 100px 1fr 120px 120px 130px 130px;
  align-items:center; gap:12px;
  background:#FDFCFA; border: 1px solid #E5DDD5; border-radius: var(--r-sm);
  padding: 14px 18px; transition: all .2s;
  animation: fadeUp .3s ease both;
  cursor:default;
}
.stock-row:hover { border-color: var(--blue); box-shadow: var(--shadow); transform:translateX(2px); }
.sr-code { font-size:1.1rem; font-weight:900; color: var(--blue); font-family:var(--mono); }
.sr-name { font-size:.95rem; font-weight:600; color: var(--txt2); }
.sr-mkt  { font-size:.8rem; padding:2px 8px; border-radius:10px; display:inline-block; margin-top:3px; }
.sr-mkt.tw { background:#EDE5D5; color:#7A5C3A; font-weight:700; }
.sr-mkt.us { background:#D8E4EE; color:#3A5472; font-weight:700; }
.sr-price { font-size:1.25rem; font-weight:900; font-family:var(--mono); text-align:right; }
.sr-pct   { font-size:1rem; font-weight:800; text-align:right; }
.sr-gain  { font-size:1.05rem; font-weight:800; font-family:var(--mono); text-align:right; }
.sr-today { font-size:1rem; font-weight:800; text-align:right; }

/* ═══════════════════════════════════════════════
   HISTORY / CHART
═══════════════════════════════════════════════ */
.range-wrap { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
.range-btn {
  border:1px solid #E5DDD5; border-radius:20px;
  padding:7px 18px; font-size:.9rem; font-weight:700;
  cursor:pointer; background:#FDFCFA; color:var(--txt2); transition:all .2s;
}
.range-btn.on, .range-btn:hover { background:var(--blue); color:#fff; border-color:var(--blue); }
.chart-wrap { position:relative; height:380px; }

/* ═══════════════════════════════════════════════
   HOLDINGS CARDS (美股詳細)
═══════════════════════════════════════════════ */
.holdings-grid {
  display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap:16px;
}
.hold-card {
  background:#FDFCFA; border:1px solid #E5DDD5; border-radius:var(--r);
  padding:18px; transition:all .25s; animation: fadeUp .35s ease both;
  position:relative; overflow:hidden;
}
.hold-card:hover { border-color:var(--blue); box-shadow:var(--shadow2); transform:translateY(-3px); }
.hold-card::after {
  content:''; position:absolute; bottom:0; left:0; right:0; height:3px;
  background:linear-gradient(90deg,var(--blue),var(--cyan));
  transform: scaleX(0); transform-origin:left; transition:.4s;
}
.hold-card:hover::after { transform:scaleX(1); }
.hc-ticker { font-size:1.35rem; font-weight:900; color:var(--blue); font-family:var(--mono); }
.hc-name   { font-size:.9rem; font-weight:600; color:var(--txt2); margin-bottom:12px; }
.hc-price  { font-size:1.8rem; font-weight:900; font-family:var(--mono); color:var(--txt); }
.hc-grid   { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
.hc-item label { font-size:.78rem; font-weight:700; color:var(--txt2); text-transform:uppercase; letter-spacing:.4px; display:block; }
.hc-item span  { font-size:1.05rem; font-weight:800; color:var(--txt); }
.hc-bar-wrap { height:5px; background:#EDE8E2; border-radius:3px; margin-top:12px; overflow:hidden; }
.hc-bar      { height:100%; border-radius:3px; background:linear-gradient(90deg,var(--blue),var(--cyan)); transition:width .8s ease; }

/* ═══════════════════════════════════════════════
   DIVIDENDS
═══════════════════════════════════════════════ */
.div-table { width:100%; border-collapse:separate; border-spacing:0 8px; }
.div-table th {
  font-size:.85rem; font-weight:800; color:var(--txt2);
  text-transform:uppercase; letter-spacing:.5px;
  padding:10px 14px; border-bottom:1px solid #E5DDD5; text-align:left;
}
.div-table td {
  padding:12px 14px; background:#FDFCFA; font-size:1rem; font-weight:600; color:var(--txt);
  border-top:1px solid #EDE8E2; border-bottom:1px solid #EDE8E2;
}
.div-table td:first-child { border-left:1px solid #EDE8E2; border-radius:var(--r-sm) 0 0 var(--r-sm); }
.div-table td:last-child  { border-right:1px solid #EDE8E2; border-radius:0 var(--r-sm) var(--r-sm) 0; }
.div-table tr:hover td    { border-color:var(--blue); }
.div-badge { display:inline-block; padding:3px 10px; border-radius:12px; font-size:.82rem; font-weight:700; }
.div-badge.div { background:#D5E8DB; color:#3A6B4A; }
.div-badge.wht { background:#EDD8D8; color:#7A3030; }

/* ═══════════════════════════════════════════════
   TRADE PANEL
═══════════════════════════════════════════════ */
.trade-filters { display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
.trade-filter {
  border:1px solid #E5DDD5; border-radius:20px;
  padding:7px 18px; font-size:.9rem; font-weight:700;
  cursor:pointer; background:#FDFCFA; color:var(--txt2); transition:all .2s;
}
.trade-filter.on, .trade-filter:hover { background:var(--blue); color:#fff; border-color:var(--blue); }
.trade-row {
  display:grid; grid-template-columns:110px 90px 70px 90px 110px 110px 90px;
  gap:10px; align-items:center;
  padding:12px 16px; background:#fff;
  border:2px solid #EEF2FF; border-radius:var(--r-sm);
  margin-bottom:8px; transition:.2s; font-size:.95rem;
  animation: slideIn .3s ease both;
}
.trade-row:hover { border-color:var(--blue); transform:translateX(4px); }
.trade-th {
  display:grid; grid-template-columns:110px 90px 70px 90px 110px 110px 90px;
  gap:10px; padding:8px 16px; margin-bottom:4px;
}
.trade-th span { font-size:.82rem; font-weight:800; color:var(--txt2); text-transform:uppercase; letter-spacing:.5px; }
.t-buy  { color:var(--dn); font-weight:900; }
.t-sell { color:var(--up); font-weight:900; }
.t-date { font-family:var(--mono); font-weight:700; color:var(--txt2); }
.t-ticker { font-weight:900; color:var(--blue); font-family:var(--mono); }

/* ═══════════════════════════════════════════════
   LOADING SKELETON
═══════════════════════════════════════════════ */
.skeleton {
  background: linear-gradient(90deg, #EDE8E2 25%, #E0D8CF 50%, #EDE8E2 75%);
  background-size: 400px 100%;
  animation: shimmer 1.2s ease-in-out infinite;
  border-radius: 8px;
}

/* ═══════════════════════════════════════════════
   NAV US section sub-metrics
═══════════════════════════════════════════════ */
.us-nav-strip {
  display:flex; gap:12px; flex-wrap:wrap; margin-bottom:18px;
  padding:16px 20px; background:#EDE8E2; border-radius:var(--r);
  border:1px solid #D8D0C6;
}
.us-nav-item label { font-size:.8rem; font-weight:800; color:var(--txt2); text-transform:uppercase; display:block; }
.us-nav-item .val  { font-size:1.4rem; font-weight:900; font-family:var(--mono); color:var(--txt); }

/* ═══════════════════════════════════════════════
   SCROLLBAR
═══════════════════════════════════════════════ */
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-track { background:#EDE8E2; }
::-webkit-scrollbar-thumb { background:var(--blue2); border-radius:3px; }

/* ═══════════════════════════════════════════════
   RESPONSIVE
═══════════════════════════════════════════════ */
@media(max-width:700px){
  html { font-size:16px; }
  #hdr { padding:14px 14px 10px; }
  #mkt-wrap, #nav { margin-left:10px; margin-right:10px; }
  .panel { margin:0 10px 16px; }
  .stock-row { grid-template-columns:90px 1fr 100px 100px; font-size:.9rem; }
  .stock-row .sr-gain, .stock-row .sr-today { display:none; }
  .trade-row { grid-template-columns:90px 70px 60px 80px 90px; }
  .trade-row .t-fee, .trade-row .t-net { display:none; }
}
</style>
</head>
<body>

<!-- ════════════════════ HEADER ════════════════════ -->
<div id="hdr">
  <div id="hdr-top">
    <div>
      <div id="hdr-title">📖 投資日記</div>
      <div id="hdate"></div>
    </div>
    <div id="hdr-right">
      <div class="fx-pill">匯率 <span id="fx-rate-val">--</span> TWD/USD</div>
      <button class="btn-refresh" onclick="refresh()">⚡ 更新</button>
      <span id="st1">載入中...</span>
    </div>
  </div>
  <div id="prog1-wrap"><div id="prog1"></div></div>
</div>

<!-- ════════════════════ MARKET TOGGLE ════════════════════ -->
<div id="mkt-wrap">
  <button class="mkt-btn on" id="mkt-tw"  onclick="setMarket('TW')">🇹🇼 台股</button>
  <button class="mkt-btn"   id="mkt-us"  onclick="setMarket('US')">🇺🇸 美股</button>
  <button class="mkt-btn"   id="mkt-all" onclick="setMarket('ALL')">🌍 全部</button>
</div>

<!-- ════════════════════ NAV ════════════════════ -->
<div id="nav">
  <div class="nav-item on" onclick="sw('overview')">📊 總覽</div>
  <div class="nav-item"    onclick="sw('holdings')">💼 持倉</div>
  <div class="nav-item"    onclick="sw('history')">📈 走勢</div>
  <div class="nav-item"    onclick="sw('dividends')">💰 股利</div>
  <div class="nav-item"    onclick="sw('lending')">🏦 借券</div>
  <div class="nav-item"    onclick="sw('trade')">🔄 交易</div>
</div>

<!-- ════════════════════ OVERVIEW ════════════════════ -->
<div class="panel on" id="panel-overview">
<div class="panel-inner">

  <!-- TW/ALL metrics -->
  <div id="metrics-tw">
    <div class="metrics-grid">
      <div class="mc blue" style="animation-delay:.05s">
        <div class="mc-label" id="ov-mv-label">台股市值</div>
        <div class="mc-v" id="ov-tw">--</div>
        <div class="mc-sub" id="ov-tws" style="color:var(--txt2)"></div>
      </div>
      <div class="mc green" style="animation-delay:.1s">
        <div class="mc-label">今日損益</div>
        <div class="mc-v" id="ov-today">--</div>
        <div class="mc-sub" id="ov-todays"></div>
      </div>
      <div class="mc gold" style="animation-delay:.15s">
        <div class="mc-label">未實現損益</div>
        <div class="mc-v" id="ov-pnl">--</div>
        <div class="mc-sub" id="ov-pnls"></div>
      </div>
      <div class="mc violet" style="animation-delay:.2s">
        <div class="mc-label">整體報酬率</div>
        <div class="mc-v" id="ov-ret">--</div>
      </div>
    </div>
  </div>

  <!-- US metrics -->
  <div id="metrics-us" style="display:none">
    <div class="us-nav-strip">
      <div class="us-nav-item">
        <label>IB NAV</label>
        <div class="val" id="ov-us-nav">--</div>
        <div style="font-size:.9rem;font-weight:700;color:var(--txt2)" id="ov-us-navs"></div>
      </div>
      <div class="us-nav-item" style="margin-left:auto">
        <label>今日損益</label>
        <div class="val mc-v" id="ov-us-today">--</div>
        <div style="font-size:.9rem;font-weight:700" id="ov-us-todays"></div>
      </div>
      <div class="us-nav-item">
        <label>未實現損益</label>
        <div class="val mc-v" id="ov-us-pnl">--</div>
        <div style="font-size:.9rem;font-weight:700" id="ov-us-pnls"></div>
      </div>
      <div class="us-nav-item">
        <label>報酬率</label>
        <div class="val mc-v" id="ov-us-ret">--</div>
      </div>
    </div>
  </div>

  <!-- Sort + Stock Table -->
  <div class="section-title">🏆 持倉明細</div>

async function gas(payload){
  const r=await fetch(GAS+'?t='+Date.now(),{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload)});
  if(!r.ok) throw new Error('連線失敗 '+r.status);
  return JSON.parse(await r.text());
}

  }catch(e){console.error('GAS error:',e);}
}

async function loadUSStockData(){
  try{
    const res=await gas({action:'read',sheet:'holdings_us'});
    if(!res.ok) return;
    const hdr=res.data[0].map(h=>String(h).trim().toLowerCase());
    const tiCol=hdr.findIndex(h=>/^(ticker|code|symbol|stock)$/.test(h));
    const mktCol=hdr.findIndex(h=>/^(market|mkt)$/.test(h));
    const shCol=hdr.findIndex(h=>/^(shares|qty|quantity|sh|lots)$/.test(h));
    const avCol=hdr.findIndex(h=>/^(avg|avg_cost|average|cost|avg_price)$/.test(h));
    const prCol=hdr.findIndex(h=>/^(price|close|current|current_price|last)$/.test(h));
    const nmCol=hdr.findIndex(h=>/^(name|stock_name|company)$/.test(h));
    const ibPnlCol=hdr.findIndex(h=>/^(ib_pnl|ibpnl|unrealized_pnl)$/.test(h));
    // fallback to positional if header not found
    const ci=(i,fb)=>i>=0?i:fb;
    usStockData=res.data.slice(1)
      .filter(r=>r[0]&&normMkt(r[ci(mktCol,1)])==='US')
      .map(r=>({
        code:String(r[ci(tiCol,0)]).trim(), mkt:'US',
        sh:+r[ci(shCol,2)]||0,
        avg:+r[ci(avCol,3)]||0,
        price:+r[ci(prCol,4)]||0,
        name:String(r[ci(nmCol,5)]||r[ci(tiCol,0)]).trim(),
        ibPnl:ibPnlCol>=0?(+r[ibPnlCol]||0):null
      })).filter(s=>s.sh>0);
    loadUSRealtimePrices();
    // ibNavUSD + ibCashUSD 已由 loadUSNav 從 us_nav sheet 讀取
    if(currentMarket==='US'||currentMarket==='ALL'){renderOverview();renderHoldings();}
  }catch(e){console.error('loadUSStockData error:',e);}
}

async function loadUSRealtimePrices(){
  if(!usStockData.length) return;
  try{
    const tickers=usStockData.map(s=>s.code);
    const res=await gas({action:'get_realtime_prices',codes:tickers,market:'US'});
    if(!res.ok) return;
    // 格式1: res.data = {TICKER:{price,prevClose,...}}
    const raw=res.data||res.prices||{};
    realtimePrices=raw;
    usStockData.forEach(s=>{
      const info=raw[s.code]||raw[s.code.toUpperCase()]||raw[s.code.toLowerCase()];
      if(!info) return;
      // 支援多種欄位名稱
      const newPrice=+(info.price||info.last||info.close||info.currentPrice||0);
      const prevClose=+(info.prevClose||info.prev_close||info.previousClose||info.yesterdayClose||0);
      if(newPrice>0) s.price=newPrice;
      if(prevClose>0) prevPricesUS[s.code]=prevClose;
      if(info.high52||info.week52High) week52Data[s.code]={
        high:+(info.high52||info.week52High||0),
        low:+(info.low52||info.week52Low||0)
      };
    });
    if(currentMarket==='US'||currentMarket==='ALL') renderOverview();
    if(document.getElementById('panel-holdings').classList.contains('on')) renderHoldings();
  }catch(_){}
}

async function fetchTWSEYesterdayClose(){
  const map={};
  try{
    const res=await gas({action:'read',sheet:'prices_tw'});
    if(!res.ok) return map;
    // 格式1: {data:[[date,code1,code2,...],[date,p1,p2,...],...]} 寬格式
    if(res.data?.length>1){
      const header=res.data[0].map(h=>{const s=String(h).trim();return /^\d{1,3}$/.test(s)?s.padStart(4,'0'):s;});
      const rows=res.data.slice(1).filter(r=>r[0]);
      if(rows.length>=1){
        const lastDate=String(rows[rows.length-1][0]).slice(0,10);
        let prevRow=rows.length>1?null:rows[0];
        if(!prevRow){for(let i=rows.length-2;i>=0;i--){if(String(rows[i][0]).slice(0,10)!==lastDate){prevRow=rows[i];break;}}}
        const useRow=prevRow||rows[rows.length-1];
        header.forEach((code,i)=>{if(!/^\d{4}$/.test(code)) return;const v=parseFloat(String(useRow[i]||'').replace(/,/g,''));if(!isNaN(v)&&v>0) map[code]=v;});
      }
    }
    // 格式2: {prices:{code:price,...}} 物件格式
    if(res.prices&&typeof res.prices==='object'){
      Object.entries(res.prices).forEach(([code,price])=>{
        const c=String(code).padStart(4,'0');
        if(+price>0) map[c]=+price;
      });
    }
  }catch(_){}
  return map;
}

async function calcTradeFees(){
  try{
    const res=await gas({action:'read',sheet:'trades_tw'});
    if(!res.ok||res.data.length<2) return;
    const hdr=res.data[0].map(h=>String(h).trim());
    const cdCol=hdr.indexOf('code'),sdCol=hdr.indexOf('side'),qtCol=hdr.indexOf('qty'),
          prCol=hdr.indexOf('price'),ttCol=hdr.indexOf('trade_type'),
          feeCol=hdr.indexOf('fee'),taxCol=hdr.indexOf('tax');
    const fees={};
    res.data.slice(1).forEach(r=>{
      if(!r[cdCol]) return;
      const code=String(r[cdCol]).padStart(4,'0');
      const side=String(r[sdCol]||'').trim();
      if(side!=='賣') return;
      if(!fees[code]) fees[code]=0;
      const hasFeeData=feeCol>=0&&taxCol>=0&&(r[feeCol]!==''&&r[feeCol]!==undefined);
      if(hasFeeData){fees[code]+=(+r[feeCol]||0)+(+r[taxCol]||0);}
      else{
        const qty=+r[qtCol]||0,price=+r[prCol]||0;
        if(qty<=0||price<=0) return;
        const amt=qty*price;
        const tradeType=ttCol>=0?String(r[ttCol]||'').trim():'';
        const isDCA=tradeType==='定期定額'||(tradeType===''&&DCA_CODES.has(code));
        fees[code]+=(isDCA?1:Math.max(1,Math.round(amt*FEE_RATE)))+(isDCA?0:Math.floor(amt*0.003));
      }
    });
    tradeFees=fees; renderOverview(); renderPnlTable();
  }catch(_){}
}

function pct(s){const fee=tradeFees[s.code]||0;const gain=(s.price-s.avg)*s.sh-fee;return s.avg*s.sh>0?gain/(s.avg*s.sh)*100:0;}
function dayChg(s){const p=prevPrices[s.code];return p?(s.price-p)/p*100:null;}
function dayChgUS(s){const p=prevPricesUS[s.code];return p&&p>0?(s.price-p)/p*100:null;}
function dayGainUS(s){const p=prevPricesUS[s.code];return p&&p>0?Math.round((s.price-p)*s.sh):null;}
function fmt(v,d=0){return v===null||v===undefined||isNaN(v)?'--':Math.round(v*Math.pow(10,d))/Math.pow(10,d);}
function fmtNum(v){return Math.abs(Math.round(v)).toLocaleString();}
function fmtPct(v,sign=true){return (sign&&v>=0?'+':'')+v.toFixed(2)+'%';}
function sign(v){return v>=0?'+':'−';}

function animCount(el,target,prefix='',suffix='',duration=800){
  const start=0,step=target/60;
  let cur=start,t=0;
  const id=setInterval(()=>{
    cur=Math.min(cur+step,target); t++;
    el.textContent=prefix+Math.round(cur).toLocaleString()+suffix;
    if(cur>=target) clearInterval(id);
  },duration/60);
}

function renderOverview(){
  const mkt=currentMarket;
  if(mkt==='US'){
    let usMv=0,usCost=0,usPnl=0,usTodayPnl=0;
    usStockData.forEach(s=>{
      usMv+=s.sh*s.price; usCost+=s.sh*s.avg;
      if(s.ibPnl!==null&&s.ibPnl!==undefined) usPnl+=s.ibPnl;
      else usPnl+=s.sh*s.price-s.sh*s.avg;
      const prev=prevPricesUS[s.code];
      if(prev&&prev>0) usTodayPnl+=(s.price-prev)*s.sh;
    });
    const navUSD=ibNavUSD>0?ibNavUSD:usMv+ibCashUSD;
    const pp=navUSD>0?usPnl/navUSD*100:0;
    const up=usPnl>=0,tup=usTodayPnl>=0;
    const cashStr=ibCashUSD!==0?` · 現金 ${ibCashUSD<0?'-':'+'}$${Math.abs(Math.round(ibCashUSD)).toLocaleString()}`:'';
    document.getElementById('ov-us-nav').textContent=`USD ${Math.round(navUSD).toLocaleString()}`;
    document.getElementById('ov-us-navs').textContent=`NT$${Math.round(navUSD*fxRate).toLocaleString()}${cashStr}`;
    const hasPrevUS=Object.keys(prevPricesUS).length>0;
    document.getElementById('ov-us-today').textContent=hasPrevUS?sign(usTodayPnl)+'$'+fmtNum(usTodayPnl):'—';
    document.getElementById('ov-us-today').className='val mc-v '+(tup?'dn':'up');
    document.getElementById('ov-us-todays').textContent=hasPrevUS?fmtPct(usMv>0?usTodayPnl/(usMv-usTodayPnl)*100:0):'';
    document.getElementById('ov-us-todays').className=tup?'dn':'up';
    document.getElementById('ov-us-pnl').textContent=sign(usPnl)+'$'+fmtNum(usPnl);
    document.getElementById('ov-us-pnl').className='val mc-v '+(up?'dn':'up');
    document.getElementById('ov-us-pnls').textContent=fmtPct(pp);
    document.getElementById('ov-us-pnls').className=up?'dn':'up';
    document.getElementById('ov-us-ret').textContent=fmtPct(pp);
    document.getElementById('ov-us-ret').className='val mc-v '+(up?'dn':'up');
  } else {
    let mv=0,cost=0,todayPnl=0,pnlAdj=0;
    stockData.forEach(s=>{
      if(s.mkt!=='TW') return;
      mv+=s.sh*s.price; cost+=s.sh*s.avg;
      const prev=prevPrices[s.code];
      if(prev&&prev>0) todayPnl+=Math.round((s.price-prev)*s.sh);
    });
    const sellFees=Object.values(tradeFees).reduce((a,v)=>a+v,0);
    pnlAdj=mv-cost-sellFees;
    if(mkt==='ALL'){
      usStockData.forEach(s=>{
        mv+=s.sh*s.price*fxRate; cost+=s.sh*s.avg*fxRate;
        const prev=prevPricesUS[s.code];
        if(prev&&prev>0) todayPnl+=Math.round((s.price-prev)*s.sh*fxRate);
        if(s.ibPnl!==null&&s.ibPnl!==undefined) pnlAdj+=s.ibPnl*fxRate;
        else pnlAdj+=(s.sh*s.price-s.sh*s.avg)*fxRate;
      });
    }
    const retDenom=mkt==='ALL'?(cost-usStockData.reduce((s,x)=>s+x.sh*x.avg*fxRate,0)+((ibNavUSD>0?ibNavUSD:usStockData.reduce((s,x)=>s+x.sh*x.price,0)+ibCashUSD)*fxRate)):cost;
    const pp=retDenom>0?pnlAdj/retDenom*100:0;
    const up=pnlAdj>=0,tup=todayPnl>=0;
    document.getElementById('ov-mv-label').textContent=mkt==='TW'?'台股市值':'總市值';
    document.getElementById('ov-tw').textContent='NT$'+Math.round(mv).toLocaleString();
    document.getElementById('ov-tws').textContent='≈ US$'+Math.round(mv/fxRate).toLocaleString();
    const hasPrev=Object.keys(prevPrices).length>0;
    const ot=document.getElementById('ov-today');
    ot.textContent=hasPrev?(tup?'+':'-')+'NT$'+Math.abs(todayPnl).toLocaleString():'—';
    ot.className='mc-v '+(tup?'up':'dn');
    document.getElementById('ov-todays').textContent=hasPrev?fmtPct(mv>0?todayPnl/(mv-todayPnl)*100:0):'';
    document.getElementById('ov-todays').className=tup?'up':'dn';
    const op=document.getElementById('ov-pnl');
    op.textContent=(up?'+':'-')+'NT$'+Math.abs(Math.round(pnlAdj)).toLocaleString();
    op.className='mc-v '+(up?'up':'dn');
    document.getElementById('ov-pnls').textContent=fmtPct(pp);
    document.getElementById('ov-pnls').className=up?'up':'dn';
    const or2=document.getElementById('ov-ret');
    or2.textContent=fmtPct(pp);
    or2.className='mc-v '+(up?'up':'dn');
  }
  renderPnlTable();
}

function setSortMode(mode,btn){
  sortMode=mode; sortDir='desc';
  document.querySelectorAll('.sort-btn').forEach(b=>b.classList.remove('on'));
  if(btn) btn.classList.add('on');
  renderPnlTable();
}

function renderPnlTable(){
  const mkt=currentMarket;
  let all=[];
  if(mkt==='TW'||mkt==='ALL') all.push(...stockData.filter(s=>s.mkt==='TW'));
  if(mkt==='US'||mkt==='ALL') all.push(...usStockData);
  const dir=sortDir==='asc'?1:-1;
  const todayAmt=s=>{
    if(s.mkt==='US'){const g=dayGainUS(s);return g!==null?g:null;}
    const p=prevPrices[s.code];return p&&p>0?(s.price-p)*s.sh:null;
  };
  if(sortMode==='today') all.sort((a,b)=>{const ca=todayAmt(a)??(-Infinity*dir),cb=todayAmt(b)??(-Infinity*dir);return dir*(ca-cb);});
  else if(sortMode==='pct') all.sort((a,b)=>dir*(pct(a)-pct(b)));
  else if(sortMode==='gain') all.sort((a,b)=>dir*((a.price-a.avg)*a.sh-(b.price-b.avg)*b.sh));
  else if(sortMode==='mv') all.sort((a,b)=>dir*(a.sh*a.price-b.sh*b.price));

  const list=document.getElementById('pnl-list');
  if(!all.length){list.innerHTML='<div style="text-align:center;padding:40px;color:var(--txt2);font-size:1rem">暫無資料</div>';return;}
  list.innerHTML=all.map((s,idx)=>{
    const isUS=s.mkt==='US';
    const fee=isUS?0:tradeFees[s.code]||0;
    const gainTWD=Math.round((s.price-s.avg)*s.sh*(isUS?fxRate:1)-fee);
    const gainPct=s.avg*s.sh>0?gainTWD/(s.avg*s.sh*(isUS?fxRate:1))*100:0;
    const gup=gainTWD>=0;
    let todayVal='—',todayPctStr='',tup=null;
    if(isUS){
      const tg=dayGainUS(s);
      if(tg!==null){todayVal=sign(tg)+'$'+fmtNum(tg);tup=tg>=0;const tc=dayChgUS(s);todayPctStr=tc!==null?fmtPct(tc):'';}
    } else {
      const prev=prevPrices[s.code];
      if(prev&&prev>0){const tg=Math.round((s.price-prev)*s.sh);todayVal=(tg>=0?'+':'-')+'NT$'+fmtNum(tg);tup=tg>=0;todayPctStr=fmtPct((s.price-prev)/prev*100);}
    }
    const posC=isUS?'var(--dn)':'var(--up)';
    const negC=isUS?'var(--up)':'var(--dn)';
    const tColor=tup===null?'var(--txt2)':tup?posC:negC;
    return `<div class="stock-row" style="animation-delay:${idx*0.04}s">
      <div>
        <div class="sr-code">${s.code}</div>
        <div class="sr-mkt ${isUS?'us':'tw'}">${isUS?'🇺🇸 US':'🇹🇼 TW'}</div>
      </div>
      <div>
        <div class="sr-name">${s.name}</div>
        <div style="font-size:.85rem;color:var(--txt2);font-weight:600">${s.sh.toLocaleString()} 股 @ ${isUS?'$':'NT$'}${s.avg.toLocaleString()}</div>
      </div>
      <div class="sr-price">${isUS?'$':'NT$'}${s.price.toLocaleString()}</div>
      <div class="sr-pct" style="color:${gup?posC:negC}">${fmtPct(gainPct)}</div>
      <div class="sr-gain" style="color:${gup?posC:negC}">${sign(gainTWD)}NT$${fmtNum(gainTWD)}</div>
      <div class="sr-today" style="color:${tColor}">${todayVal}<br><span style="font-size:.82rem">${todayPctStr}</span></div>
    </div>`;
  }).join('');
}

  const totalMV=stocks.reduce((s,x)=>s+x.sh*x.price*(x.mkt==='US'?fxRate:1),0);

    const isUS=s.mkt==='US';

    const gup=gain>=0;

      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px">

          ${dayStr?`<div style="font-size:.9rem;font-weight:700;color:${gup?posC:negC}">${dayStr}</div>`:''}
        </div>
      </div>
      <div class="hc-grid">
        <div class="hc-item"><label>持股數</label><span>${s.sh.toLocaleString()}</span></div>
        <div class="hc-item"><label>成本</label><span>${isUS?'$':'NT$'}${s.avg.toLocaleString()}</span></div>
        <div class="hc-item"><label>市值</label><span>NT$${Math.round(mv).toLocaleString()}</span></div>
        <div class="hc-item"><label>損益</label>
          <span style="color:${gup?posC:negC}">${sign(gain)}${isUS?'$':'NT$'}${fmtNum(gain*Math.abs(isUS?fxRate:1))} ${fmtPct(gainPct)}</span>
        </div>
      </div>
      <div class="hc-bar-wrap"><div class="hc-bar" style="width:${mvPct.toFixed(1)}%;background:linear-gradient(90deg,${color},${color}88)"></div></div>
      <div style="font-size:.8rem;font-weight:700;color:var(--txt2);margin-top:4px">佔比 ${mvPct.toFixed(1)}%</div>

function drawLineChart(canvasId,labels,datasets,prefix){
  const ctx=document.getElementById(canvasId).getContext('2d');
  if(canvasId==='lineChart'&&lineChart){lineChart.destroy();}
  if(canvasId==='usNavChart'&&usNavChart){usNavChart.destroy();}
  const ch=new Chart(ctx,{
    type:'line',
    data:{labels,datasets},
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:true,labels:{color:'#3D3530',font:{size:14,weight:'600'}}},
        tooltip:{backgroundColor:'#3D3530',titleColor:'#C8BAB0',bodyColor:'#F5EDE4',padding:12,
          callbacks:{label:ctx=>`${prefix}${Math.round(ctx.parsed.y).toLocaleString()}`}}},
      scales:{
        x:{grid:{color:'rgba(61,53,48,.05)'},ticks:{color:'#6B6058',font:{size:13,weight:'600'},maxTicksLimit:8}},
        y:{grid:{color:'rgba(61,53,48,.05)'},ticks:{color:'#6B6058',font:{size:13,weight:'600'},
          callback:v=>`${prefix}${Math.round(v).toLocaleString()}`}}
      },
      animation:{duration:1000,easing:'easeInOutQuart'}
    }
  });
  if(canvasId==='lineChart') lineChart=ch;
  else usNavChart=ch;
}

function renderDividends(){
  const mkt=currentMarket;
  let records=[];
  if(mkt==='TW'||mkt==='ALL'){
    divRecordsCache.forEach(r=>records.push({date:r.date,ticker:r.code,name:r.name,amount:r.shares*r.cps,currency:'TWD',type:'Dividends',mkt:'TW'}));
  }
  // US dividends from us_nav data (if available, otherwise show placeholder)
  if(mkt==='US'||mkt==='ALL'){
    // Will be loaded from GAS if available
    loadUSDividends(records, mkt);
    return;
  }
  renderDivTable(records,mkt);
}

async function loadUSDividends(twRecords,mkt){
  let usDiv=[];
  try{
    const res=await gas({action:'read',sheet:'dividends'});
    if(res.ok&&res.data?.length>1){
      const hdr=res.data[0].map(h=>String(h).trim());
      const mktI=hdr.indexOf('market'),tkI=hdr.indexOf('ticker'),dtI=hdr.indexOf('date'),
            amtI=hdr.indexOf('amount'),tpI=hdr.indexOf('type'),curI=hdr.indexOf('currency');
      usDiv=res.data.slice(1)
        .filter(r=>r[0]&&(mktI<0||normMkt(r[mktI])==='US'))
        .map(r=>({
          date:String(r[dtI]).slice(0,10),
          ticker:String(r[tkI]).trim(),
          name:String(r[hdr.indexOf('name')]||r[tkI]).trim(),
          amount:+r[amtI]||0,
          currency:String(r[curI]).trim(),
          type:String(r[tpI]).trim(),mkt:'US'
        }));
    }
  }catch(_){}
  const all=(mkt==='US'?usDiv:(mkt==='TW'?twRecords:[...twRecords,...usDiv]))
    .sort((a,b)=>b.date.localeCompare(a.date));
  renderDivTable(all,mkt);
}

function renderDivTable(records,mkt){
  const years=[...new Set(records.map(r=>r.date.slice(0,4)))].sort((a,b)=>b-a);
  const wrap=document.getElementById('div-year-wrap');
  wrap.innerHTML=years.map(y=>`<button class="range-btn${y===divYearFilter?' on':''}" onclick="divYearFilter='${y}';renderDividends()">${y}</button>`).join('');
  const filtered=records.filter(r=>r.date.startsWith(divYearFilter));
  const total=filtered.reduce((s,r)=>s+Math.abs(r.amount)*(r.currency==='TWD'?1:fxRate),0);
  const tbody=document.getElementById('div-body');
  if(!filtered.length){tbody.innerHTML=`<tr><td colspan="5" style="text-align:center;padding:24px;color:var(--txt2)">${divYearFilter} 年無股利紀錄</td></tr>`;return;}
  tbody.innerHTML=`<tr><td colspan="5" style="background:#D5E8DB;border-radius:var(--r-sm)">
    <b style="font-size:1.1rem;color:#3A6B4A">💰 ${divYearFilter} 年股利合計：NT$${Math.round(total).toLocaleString()}</b></td></tr>`+
  filtered.map(r=>`<tr>
    <td><b>${r.date}</b></td>
    <td><b style="color:var(--blue)">${r.ticker}</b><br><span style="font-size:.85rem;color:var(--txt2)">${r.name}</span></td>
    <td><span class="div-badge ${r.type==='Dividends'?'div':'wht'}">${r.type==='Dividends'?'現金股利':'預扣稅'}</span></td>
    <td><b style="color:${r.amount>=0?'var(--dn)':'var(--up)'};font-size:1.1rem">${r.currency==='TWD'?'NT$':'$'}${Math.abs(r.amount).toLocaleString()}</b></td>
    <td><b>${r.currency}</b></td>
  </tr>`).join('');
}

async function renderTrades(){
  const list=document.getElementById('trade-list');
  let trades=[];
  // US trades (already loaded)
  if(tradeFilter!=='TW') trades.push(...usTradesData);
  // TW trades
  if(tradeFilter!=='US'){
    try{
      const res=await gas({action:'read',sheet:'trades_tw'});
      if(res.ok&&res.data?.length>1){
        const hdr=res.data[0].map(h=>String(h).trim().toLowerCase());
        // Bug1 fix: 用 findIndex 搭配 regex，避免 indexOf 回傳 0 被 ||fb 誤判
        const dtI=hdr.findIndex(h=>/^(date|日期)$/.test(h));
        const tkI=hdr.findIndex(h=>/^(code|ticker|symbol|股票代號)$/.test(h));
        const sdI=hdr.findIndex(h=>/^(side|action|type|方向|買賣)$/.test(h));
        const qtI=hdr.findIndex(h=>/^(qty|quantity|shares|數量)$/.test(h));
        const prI=hdr.findIndex(h=>/^(price|close|成交價)$/.test(h));
        const ci=(i,fb)=>i>=0?i:fb;
