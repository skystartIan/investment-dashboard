<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>投資日記</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --font: 'Sora', sans-serif;
  --mono: 'DM Mono', monospace;
  --radius: 14px;
  --radius-sm: 8px;
}

/* ── Dark theme (default) ── */
body.dark {
  --bg: #0d0f12;
  --surface: #161920;
  --surface2: #1e222d;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.13);
  --text: #f0f2f5;
  --text2: #8b92a5;
  --text3: #4e5668;
  --green: #00c896;
  --green-bg: rgba(0,200,150,0.1);
  --red: #ff5c6a;
  --red-bg: rgba(255,92,106,0.1);
  --blue: #4d9fff;
  --btn-bg: #1e222d;
  --btn-border: rgba(255,255,255,0.13);
  --shadow: none;
}

/* ── Light theme ── */
body.light {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --surface2: #f0f2f5;
  --border: rgba(0,0,0,0.07);
  --border2: rgba(0,0,0,0.12);
  --text: #1a1d24;
  --text2: #5a6278;
  --text3: #9ba3b5;
  --green: #00a876;
  --green-bg: rgba(0,168,118,0.08);
  --red: #e03444;
  --red-bg: rgba(224,52,68,0.08);
  --blue: #2b7de9;
  --btn-bg: #f0f2f5;
  --btn-border: rgba(0,0,0,0.1);
  --shadow: 0 1px 4px rgba(0,0,0,0.06);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  min-height: 100vh;
  transition: background 0.25s, color 0.25s;
}

/* ── Header ── */
.header {
  padding: 20px 20px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.header-left { display: flex; flex-direction: column; gap: 3px; }
.header-title { font-size: 15px; font-weight: 600; letter-spacing: 0.04em; }
.header-date { font-family: var(--mono); font-size: 12px; color: var(--text3); }
.header-right { display: flex; gap: 8px; align-items: center; }

/* Theme toggle */
.theme-toggle {
  width: 40px; height: 24px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 12px;
  cursor: pointer;
  position: relative;
  transition: background 0.2s;
  flex-shrink: 0;
}
.theme-toggle::after {
  content: '';
  position: absolute;
  top: 3px; left: 3px;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--text3);
  transition: transform 0.2s, background 0.2s;
}
body.light .theme-toggle::after { transform: translateX(16px); background: var(--green); }
.theme-label { font-size: 11px; color: var(--text3); }

.refresh-btn {
  background: var(--btn-bg);
  border: 1px solid var(--btn-border);
  color: var(--text2);
  padding: 7px 14px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  cursor: pointer;
  font-family: var(--font);
  transition: all 0.2s;
}
.refresh-btn:hover { color: var(--text); border-color: var(--green); }

/* ── Nav ── */
.nav {
  display: flex;
  gap: 2px;
  padding: 16px 20px 0;
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
}
.nav::-webkit-scrollbar { display: none; }
.nav-item {
  padding: 10px 18px;
  font-size: 14px;
  cursor: pointer;
  color: var(--text2);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: all 0.2s;
  white-space: nowrap;
  border-radius: 6px 6px 0 0;
}
.nav-item:hover { color: var(--text); }
.nav-item.on { color: var(--green); border-bottom-color: var(--green); font-weight: 500; }

/* ── Panels ── */
.panel { display: none; padding: 20px; }
.panel.on { display: block; }

/* ── Metric cards ── */
.metrics {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}
@media(min-width:640px){ .metrics { grid-template-columns: repeat(4, 1fr); } }
.mc {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  box-shadow: var(--shadow);
}
.mc-l { font-size: 12px; color: var(--text3); letter-spacing: 0.04em; margin-bottom: 7px; }
.mc-v { font-family: var(--mono); font-size: 22px; font-weight: 500; line-height: 1; }
.mc-s { font-size: 12px; margin-top: 5px; color: var(--text3); }
.up { color: var(--green) !important; }
.dn { color: var(--red) !important; }

/* ── Chart card ── */
.chart-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.chart-title {
  font-size: 13px;
  color: var(--text2);
  margin-bottom: 16px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}
.chart-wrap { position: relative; width: 100%; }

/* ── Range buttons ── */
.range-btns { display: flex; gap: 4px; flex-wrap: wrap; }
.range-btn {
  background: transparent;
  border: 1px solid var(--border2);
  color: var(--text3);
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
  font-family: var(--font);
  transition: all 0.15s;
  white-space: nowrap;
}
.range-btn:hover { color: var(--text2); }
.range-btn.on { background: var(--green-bg); border-color: var(--green); color: var(--green); }

/* Custom date range */
.custom-range {
  display: none;
  gap: 8px;
  align-items: center;
  margin-top: 10px;
  flex-wrap: wrap;
}
.custom-range.show { display: flex; }
.custom-range input[type=date] {
  background: var(--surface2);
  border: 1px solid var(--border2);
  color: var(--text);
  padding: 6px 10px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-family: var(--font);
  outline: none;
}
.custom-range label { font-size: 12px; color: var(--text3); }

/* ── Horizontal bar (PnL) ── */
.pnl-list { display: flex; flex-direction: column; gap: 10px; }
.pnl-row { display: flex; flex-direction: column; gap: 4px; }
.pnl-top { display: flex; justify-content: space-between; align-items: baseline; }
.pnl-name { font-size: 14px; font-weight: 500; color: var(--text); }
.pnl-pct { font-family: var(--mono); font-size: 14px; font-weight: 500; }
.pnl-bar-bg { height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
.pnl-bar-fill { height: 8px; border-radius: 4px; transition: width 0.6s cubic-bezier(0.4,0,0.2,1); }
.pnl-sub { font-size: 12px; color: var(--text3); font-family: var(--mono); }

/* ── Table ── */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th {
  text-align: right;
  font-size: 12px;
  font-weight: 500;
  color: var(--text3);
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  letter-spacing: 0.04em;
  white-space: nowrap;
}
th:first-child, th:nth-child(2) { text-align: left; }
td {
  padding: 12px 10px;
  border-bottom: 1px solid var(--border);
  text-align: right;
  font-family: var(--mono);
  font-size: 13px;
  color: var(--text2);
  white-space: nowrap;
}
td:first-child { text-align: left; font-family: var(--font); font-weight: 500; color: var(--text); font-size: 14px; }
td:nth-child(2) { text-align: left; font-family: var(--font); color: var(--text2); font-size: 13px; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--surface2); }

/* ── Pie legend ── */
.pie-leg {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-top: 16px;
}
@media(min-width:480px){ .pie-leg { grid-template-columns: repeat(3, 1fr); } }
.leg-item { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text3); }
.leg-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

/* ── Buttons ── */
.btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.btn {
  background: var(--btn-bg);
  border: 1px solid var(--btn-border);
  color: var(--text2);
  padding: 9px 18px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  cursor: pointer;
  font-family: var(--font);
  transition: all 0.2s;
}
.btn:hover { color: var(--text); }
.btn-primary { background: var(--green-bg); border-color: var(--green); color: var(--green); }
.btn-primary:hover { filter: brightness(1.1); }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

/* ── Status ── */
.status { font-size: 13px; color: var(--text3); margin-top: 8px; min-height: 18px; font-family: var(--mono); }
.status.ok { color: var(--green); }
.status.err { color: var(--red); }

/* ── Progress ── */
.prog { height: 2px; background: var(--surface2); border-radius: 1px; margin-top: 8px; overflow: hidden; }
.prog-bar { height: 2px; background: var(--green); border-radius: 1px; width: 0%; transition: width 0.4s; }

/* ── Form ── */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.fg { display: flex; flex-direction: column; gap: 5px; }
.fg label { font-size: 12px; color: var(--text3); letter-spacing: 0.04em; }
.fg input, .fg select {
  background: var(--surface2);
  border: 1px solid var(--border2);
  color: var(--text);
  padding: 10px 13px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-family: var(--font);
  outline: none;
  transition: border-color 0.2s;
}
.fg input:focus, .fg select:focus { border-color: var(--green); }
.fg select option { background: var(--surface2); }

/* ── Snap list ── */
.snap-item { display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--border); }
.snap-item:last-child { border-bottom: none; }
.snap-date { font-family: var(--mono); font-size: 13px; color: var(--text3); }
.snap-val { font-family: var(--mono); font-size: 14px; color: var(--text); }

/* ── Lending section ── */
.section-label { font-size: 12px; color: var(--text3); letter-spacing: 0.06em; text-transform: uppercase; margin: 20px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }

.loading { text-align: center; padding: 40px; color: var(--text3); font-size: 14px; }
</style>
</head>
<body class="dark">

<div class="header">
  <div class="header-left">
    <div class="header-title">投資日記</div>
    <div class="header-date" id="hdate"></div>
  </div>
  <div class="header-right">
    <span class="theme-label" id="theme-label">暗色</span>
    <div class="theme-toggle" id="themeToggle" onclick="toggleTheme()"></div>
    <button class="refresh-btn" onclick="refresh()">↻ 更新</button>
  </div>
</div>

<div class="nav">
  <div class="nav-item on" onclick="sw('overview')">總覽</div>
  <div class="nav-item" onclick="sw('holdings')">持倉</div>
  <div class="nav-item" onclick="sw('history')">走勢</div>
  <div class="nav-item" onclick="sw('lending')">借貸</div>
  <div class="nav-item" onclick="sw('add')">更新</div>
</div>

<!-- 總覽 -->
<div class="panel on" id="panel-overview">
  <div class="metrics">
    <div class="mc"><div class="mc-l">台股市值</div><div class="mc-v" id="ov-tw">—</div><div class="mc-s" id="ov-tw-s"></div></div>
    <div class="mc"><div class="mc-l">未實現損益</div><div class="mc-v" id="ov-pnl">—</div><div class="mc-s" id="ov-pnl-s"></div></div>
    <div class="mc"><div class="mc-l">總成本</div><div class="mc-v" id="ov-cost">—</div><div class="mc-s" style="color:var(--text3)">TWD</div></div>
    <div class="mc"><div class="mc-l">報酬率</div><div class="mc-v" id="ov-ret">—</div><div class="mc-s" style="color:var(--text3)">整體</div></div>
  </div>
  <div class="chart-card">
    <div class="chart-title">個股損益</div>
    <div class="pnl-list" id="pnl-list"><div class="loading">載入中...</div></div>
  </div>
  <div class="btns">
    <button class="btn btn-primary" onclick="doSnap()">存今日快照</button>
    <button class="btn" onclick="sw('add')">更新股價</button>
  </div>
  <div class="prog"><div class="prog-bar" id="prog1"></div></div>
  <div class="status" id="st1"></div>
</div>

<!-- 持倉 -->
<div class="panel" id="panel-holdings">
  <div class="chart-card">
    <div class="chart-title">市值配置</div>
    <div class="chart-wrap" style="height:260px"><canvas id="pieC" role="img" aria-label="市值配置"></canvas></div>
    <div class="pie-leg" id="pie-leg"></div>
  </div>
  <div class="tbl-wrap">
    <table>
      <thead><tr>
        <th>代號</th><th>名稱</th><th>股數</th><th>均價</th><th>現價</th><th>損益%</th><th>市值 (NT$)</th>
      </tr></thead>
      <tbody id="h-body"><tr><td colspan="7" class="loading">載入中...</td></tr></tbody>
    </table>
  </div>
</div>

<!-- 走勢 -->
<div class="panel" id="panel-history">
  <div class="chart-card">
    <div class="chart-title">
      <span>台股市值走勢</span>
      <div class="range-btns">
        <button class="range-btn" onclick="setRange('MTD')">本月</button>
        <button class="range-btn" onclick="setRange(1)">1M</button>
        <button class="range-btn" onclick="setRange(3)">3M</button>
        <button class="range-btn" onclick="setRange(6)">6M</button>
        <button class="range-btn" onclick="setRange('YTD')">今年</button>
        <button class="range-btn" onclick="setRange(12)">1Y</button>
        <button class="range-btn on" onclick="setRange(0)">全部</button>
        <button class="range-btn" onclick="setRange('custom')">自訂</button>
      </div>
    </div>
    <div class="custom-range" id="customRange">
      <label>從</label>
      <input type="date" id="dateFrom">
      <label>到</label>
      <input type="date" id="dateTo">
      <button class="range-btn on" onclick="applyCustom()">套用</button>
    </div>
    <div class="chart-wrap" style="height:300px; margin-top:12px"><canvas id="lineC" role="img" aria-label="台股歷史走勢"></canvas></div>
  </div>
  <div id="snap-list"><div class="loading">載入中...</div></div>
</div>

<!-- 借貸 -->
<div class="panel" id="panel-lending">
  <div class="metrics">
    <div class="mc"><div class="mc-l">借出股數（合計）</div><div class="mc-v" id="lend-shares">—</div><div class="mc-s" style="color:var(--text3)">股</div></div>
    <div class="mc"><div class="mc-l">借貸收入（合計）</div><div class="mc-v up" id="lend-income">—</div><div class="mc-s" style="color:var(--text3)">TWD</div></div>
    <div class="mc"><div class="mc-l">借貸市值</div><div class="mc-v" id="lend-mv">—</div><div class="mc-s" style="color:var(--text3)">TWD</div></div>
    <div class="mc"><div class="mc-l">借貸年化收益率</div><div class="mc-v up" id="lend-rate">—</div><div class="mc-s" style="color:var(--text3)">估算</div></div>
  </div>
  <div class="chart-card">
    <div class="chart-title">借貸明細</div>
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th>代號</th><th>名稱</th><th>借出股數</th><th>借出日期</th><th>日費率%</th><th>累計收入(NT$)</th><th>市值(NT$)</th>
        </tr></thead>
        <tbody id="lend-body"><tr><td colspan="7" style="text-align:left;padding:20px 10px;color:var(--text3);font-size:14px">尚無借貸記錄，請在下方新增。</td></tr></tbody>
      </table>
    </div>
  </div>
  <div class="section-label">新增借貸記錄</div>
  <div class="chart-card">
    <div class="form-grid">
      <div class="fg"><label>股票代號</label><input type="text" id="l-code" placeholder="0050"></div>
      <div class="fg"><label>名稱</label><input type="text" id="l-name" placeholder="元大台灣50"></div>
    </div>
    <div class="form-grid">
      <div class="fg"><label>借出股數</label><input type="number" id="l-shares" placeholder="1000"></div>
      <div class="fg"><label>借出日期</label><input type="date" id="l-date"></div>
    </div>
    <div class="form-grid">
      <div class="fg"><label>日費率 (%)</label><input type="number" id="l-rate" placeholder="0.05" step="0.001"></div>
      <div class="fg"><label>累計收入 (NT$)</label><input type="number" id="l-income" placeholder="150"></div>
    </div>
    <div class="btns" style="margin-top:12px">
      <button class="btn btn-primary" onclick="addLending()">新增借貸</button>
    </div>
  </div>
  <div class="prog"><div class="prog-bar" id="prog3"></div></div>
  <div class="status" id="st3"></div>
</div>

<!-- 更新 -->
<div class="panel" id="panel-add">
  <div class="chart-card">
    <div class="chart-title">新增 / 更新持股</div>
    <div class="form-grid">
      <div class="fg"><label>股票代號</label><input type="text" id="f-t" placeholder="0050 / 2330"></div>
      <div class="fg"><label>市場</label><select id="f-m"><option value="TW">台股 TWD</option><option value="US">美股 USD</option></select></div>
    </div>
    <div class="form-grid">
      <div class="fg"><label>股數</label><input type="number" id="f-s" placeholder="100"></div>
      <div class="fg"><label>平均成本</label><input type="number" id="f-c" placeholder="450.00" step="0.01"></div>
    </div>
    <div class="form-grid">
      <div class="fg"><label>現價</label><input type="number" id="f-p" placeholder="500.00" step="0.01"></div>
      <div class="fg"><label>名稱</label><input type="text" id="f-n" placeholder="元大台灣50"></div>
    </div>
    <div class="btns" style="margin-top:12px">
      <button class="btn btn-primary" onclick="addStock()">寫入 Sheets</button>
    </div>
  </div>
  <div class="prog"><div class="prog-bar" id="prog2"></div></div>
  <div class="status" id="st2"></div>
</div>

<script>
const GAS = 'https://script.google.com/macros/s/AKfycbxs6SGJCCraFtTAfq9L_NMeL7fyvM_HnZ7HPklCJpoRNJemPacdBpXNuzRz0NuRKDLVQg/exec';
const FX = 32.5;

let stockData = [], lendData = [], allSnaps = [];
let pieChart = null, lineChart = null;

const histInit = [
  ['2024-04-28',186,0,6046],['2024-06-28',808,0,26244],['2024-07-28',1483,0,48189],
  ['2024-08-28',1858,0,60389],['2024-09-28',2575,0,83683],['2024-10-28',3306,0,107450],
  ['2024-11-28',3959,0,128660],['2024-12-28',9274,0,301413],['2025-01-28',17127,0,556642],
  ['2025-02-28',19481,0,633118],['2025-03-28',19974,0,649152],['2025-04-28',18253,0,593214],
  ['2025-05-28',19816,0,644025],['2025-06-28',21376,0,694689],['2025-07-28',15247,0,495517],
  ['2025-08-28',16090,0,522935],['2025-09-28',18469,0,600255],['2025-10-28',16464,0,535085],
  ['2025-11-28',9183,0,298451],['2025-12-28',16059,0,521914],['2026-01-28',33521,0,1089450],
  ['2026-02-28',32866,0,1068155],['2026-03-28',38040,0,1236292],
];

// Theme
function toggleTheme() {
  const isLight = document.body.classList.contains('light');
  document.body.className = isLight ? 'dark' : 'light';
  document.getElementById('theme-label').textContent = isLight ? '暗色' : '亮色';
  localStorage.setItem('theme', isLight ? 'dark' : 'light');
  if (lineChart) renderLine(allSnaps);
  if (pieChart) renderHoldings();
}
(function(){
  const saved = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.body.className = saved;
  document.getElementById('theme-label').textContent = saved === 'dark' ? '暗色' : '亮色';
})();

document.getElementById('hdate').textContent = new Date().toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric'});

function sw(id) {
  document.querySelectorAll('.nav-item').forEach((t,i)=>{
    t.classList.toggle('on',['overview','holdings','history','lending','add'][i]===id);
  });
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  document.getElementById('panel-'+id).classList.add('on');
  if(id==='holdings' && stockData.length) renderHoldings();
  if(id==='history') renderHistoryPanel();
  if(id==='lending') renderLending();
}

async function gasCall(payload) {
  const r = await fetch(GAS+'?t='+Date.now(), {
    method:'POST', headers:{'Content-Type':'text/plain'},
    body: JSON.stringify(payload)
  });
  if(!r.ok) throw new Error('連線失敗 '+r.status);
  const txt = await r.text();
  try { return JSON.parse(txt); } catch(e) { throw new Error('回應格式錯誤'); }
}

async function refresh() {
  const st=document.getElementById('st1'), pb=document.getElementById('prog1');
  st.textContent='讀取中...'; st.className='status';
  pb.style.width='20%';
  try {
    const res = await gasCall({action:'read',sheet:'holdings'});
    if(!res.ok) throw new Error(res.error||'讀取失敗');
    stockData = res.data.slice(1).filter(r=>r[0]).map(r=>({
      code:String(r[0]), mkt:r[1], sh:+r[2], avg:+r[3], price:+r[4], name:r[5]||r[0]
    }));
    pb.style.width='100%';
    renderOverview();
    st.textContent='更新：'+new Date().toLocaleTimeString('zh-TW');
    st.className='status ok';
  } catch(e) {
    st.textContent=e.message; st.className='status err'; pb.style.width='0%';
  }
}

function pct(s) { return (s.price - s.avg) / s.avg * 100; }

function renderOverview() {
  let twV=0, twCost=0;
  stockData.forEach(s=>{ if(s.mkt==='TW'){twV+=s.sh*s.price; twCost+=s.sh*s.avg;} });
  const pnl=twV-twCost, pnlP=twCost>0?pnl/twCost*100:0, pu=pnl>=0;
  document.getElementById('ov-tw').textContent='NT$'+Math.round(twV).toLocaleString();
  document.getElementById('ov-tw-s').textContent='≈ $'+Math.round(twV/FX).toLocaleString()+' USD';
  document.getElementById('ov-pnl').textContent=(pu?'+':'-')+'NT$'+Math.abs(Math.round(pnl)).toLocaleString();
  document.getElementById('ov-pnl').className='mc-v '+(pu?'up':'dn');
  document.getElementById('ov-pnl-s').textContent=(pu?'+':'')+pnlP.toFixed(1)+'%';
  document.getElementById('ov-pnl-s').className=pu?'up':'dn';
  document.getElementById('ov-cost').textContent='NT$'+Math.round(twCost).toLocaleString();
  document.getElementById('ov-ret').textContent=(pu?'+':'')+pnlP.toFixed(1)+'%';
  document.getElementById('ov-ret').className='mc-v '+(pu?'up':'dn');
  renderPnlBars();
}

function renderPnlBars() {
  const tw = stockData.filter(s=>s.mkt==='TW').sort((a,b)=>pct(b)-pct(a));
  const maxAbs = Math.max(...tw.map(s=>Math.abs(pct(s))), 1);
  const isDark = document.body.classList.contains('dark');
  document.getElementById('pnl-list').innerHTML = tw.map(s=>{
    const p = pct(s), up = p>=0;
    const barW = Math.abs(p)/maxAbs*100;
    const barColor = up
      ? (isDark ? 'rgba(0,200,150,0.7)' : 'rgba(0,168,118,0.65)')
      : (isDark ? 'rgba(255,92,106,0.7)' : 'rgba(224,52,68,0.65)');
    const gain = Math.round((s.price - s.avg) * s.sh);
    return `<div class="pnl-row">
      <div class="pnl-top">
        <div class="pnl-name">${s.name} <span style="font-size:12px;color:var(--text3);font-weight:400">${s.code}</span></div>
        <div class="pnl-pct ${up?'up':'dn'}">${up?'+':''}${p.toFixed(2)}%</div>
      </div>
      <div class="pnl-bar-bg">
        <div class="pnl-bar-fill" style="width:${barW.toFixed(1)}%;background:${barColor}"></div>
      </div>
      <div class="pnl-sub">${s.sh.toLocaleString()} 股 · 均價 ${s.avg>=100?Math.round(s.avg):s.avg.toFixed(2)} · 現價 ${s.price>=100?s.price.toLocaleString():s.price.toFixed(2)} · ${up?'+':''} NT$${gain.toLocaleString()}</div>
    </div>`;
  }).join('');
}

function renderHoldings() {
  if(pieChart){pieChart.destroy();}
  const tw = stockData.filter(s=>s.mkt==='TW').sort((a,b)=>b.sh*b.price-a.sh*a.price);
  const total = tw.reduce((s,x)=>s+x.sh*x.price,0);
  const isDark = document.body.classList.contains('dark');
  pieChart = new Chart(document.getElementById('pieC'),{
    type:'doughnut',
    data:{labels:tw.map(s=>s.name), datasets:[{
      data:tw.map(s=>Math.round(s.sh*s.price)),
      backgroundColor:PIE_COLORS, borderWidth:0, hoverOffset:10,
      borderColor: isDark ? '#161920' : '#ffffff', borderWidth: 2
    }]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'58%',
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` NT$${Math.round(c.parsed).toLocaleString()} (${(c.parsed/total*100).toFixed(1)}%)`}}}}
  });
  document.getElementById('pie-leg').innerHTML = tw.map((s,i)=>`
    <div class="leg-item"><div class="leg-dot" style="background:${PIE_COLORS[i]}"></div>
    ${s.name} <span style="color:var(--text2);font-family:var(--mono);margin-left:auto">${(s.sh*s.price/total*100).toFixed(1)}%</span></div>`).join('');
  document.getElementById('h-body').innerHTML = tw.map(s=>{
    const p=pct(s),up=p>=0;
    return `<tr>
      <td>${s.code}</td><td>${s.name}</td>
      <td>${s.sh.toLocaleString()}</td>
      <td>${s.avg>=100?Math.round(s.avg).toLocaleString():s.avg.toFixed(2)}</td>
      <td style="color:var(--text)">${s.price>=100?s.price.toLocaleString():s.price.toFixed(2)}</td>
      <td class="${up?'up':'dn'}">${up?'+':''}${p.toFixed(1)}%</td>
      <td>${Math.round(s.sh*s.price).toLocaleString()}</td>
    </tr>`;
  }).join('');
}

async function renderHistoryPanel() {
  try {
    const res = await gasCall({action:'read',sheet:'snapshots'});
    let rows = [];
    if(res.ok && res.data.length>1) {
      rows = res.data.slice(1).filter(r=>r[0]).map(r=>({d:String(r[0]),tw:+r[3]||0}));
    }
    const existing = new Set(rows.map(r=>r.d.slice(0,7)));
    histInit.forEach(h=>{ if(!existing.has(h[0].slice(0,7))) rows.push({d:h[0],tw:h[3]}); });
    rows.sort((a,b)=>a.d.localeCompare(b.d));
    allSnaps = rows;
    renderLine(rows);
    document.getElementById('snap-list').innerHTML = [...rows].reverse().slice(0,15).map(r=>`
      <div class="snap-item">
        <span class="snap-date">${r.d}</span>
        <span class="snap-val">NT$${Math.round(r.tw).toLocaleString()}</span>
      </div>`).join('');
  } catch(e) {
    document.getElementById('snap-list').innerHTML=`<div class="loading" style="color:var(--red)">${e.message}</div>`;
  }
}

function setRange(range) {
  document.querySelectorAll('.range-btn').forEach(b=>b.classList.remove('on'));
  event.target.classList.add('on');
  const cr = document.getElementById('customRange');
  if(range==='custom') { cr.classList.add('show'); return; }
  cr.classList.remove('show');
  filterAndDraw(range);
}

function filterAndDraw(range) {
  const now = new Date();
  let data = allSnaps;
  if(range==='MTD') {
    const start = new Date(now.getFullYear(), now.getMonth(), 1);
    data = allSnaps.filter(r=>new Date(r.d)>=start);
  } else if(range==='YTD') {
    const start = new Date(now.getFullYear(), 0, 1);
    data = allSnaps.filter(r=>new Date(r.d)>=start);
  } else if(typeof range === 'number' && range>0) {
    const cutoff = new Date(); cutoff.setMonth(cutoff.getMonth()-range);
    data = allSnaps.filter(r=>new Date(r.d)>=cutoff);
  }
  renderLine(data);
}

function applyCustom() {
  const from = document.getElementById('dateFrom').value;
  const to = document.getElementById('dateTo').value;
  if(!from||!to) return;
  const data = allSnaps.filter(r=>r.d>=from && r.d<=to);
  renderLine(data);
}

function renderLine(rows) {
  if(lineChart){lineChart.destroy();}
  if(!rows||rows.length<1) return;
  const isDark = document.body.classList.contains('dark');
  const gridColor = isDark ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.05)';
  const tickColor = isDark ? '#4e5668' : '#9ba3b5';
  const borderColor = isDark ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.07)';
  lineChart = new Chart(document.getElementById('lineC'),{
    type:'line',
    data:{labels:rows.map(r=>r.d.slice(0,7)), datasets:[{
      label:'台股市值',data:rows.map(r=>r.tw),
      borderColor: isDark?'#00c896':'#00a876',
      backgroundColor: isDark?'rgba(0,200,150,0.06)':'rgba(0,168,118,0.06)',
      tension:0.35,fill:true,
      pointRadius:rows.length>20?2:4,
      pointBackgroundColor: isDark?'#00c896':'#00a876',
      pointHoverRadius:7, borderWidth:2
    }]},
    options:{responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' NT$'+Math.round(c.parsed.y).toLocaleString()}}},
      scales:{
        x:{ticks:{color:tickColor,font:{size:12},maxRotation:40,autoSkip:true},grid:{display:false},border:{color:borderColor}},
        y:{ticks:{color:tickColor,callback:v=>v>=1000000?'$'+(v/1000000).toFixed(1)+'M':'$'+(v/1000).toFixed(0)+'K',font:{size:12}},grid:{color:gridColor},border:{color:borderColor}}
      }}
  });
}

function renderLending() {
  const rows = lendData;
  if(!rows.length) return;
  let totalShares=0, totalIncome=0, totalMV=0;
  rows.forEach(r=>{
    totalShares += r.shares;
    totalIncome += r.income;
    const s = stockData.find(x=>x.code===r.code);
    if(s) totalMV += r.shares * s.price;
  });
  document.getElementById('lend-shares').textContent = totalShares.toLocaleString();
  document.getElementById('lend-income').textContent = 'NT$'+Math.round(totalIncome).toLocaleString();
  document.getElementById('lend-mv').textContent = totalMV ? 'NT$'+Math.round(totalMV).toLocaleString() : '—';
  const rate = totalMV>0 ? (totalIncome/totalMV*365/30*100) : 0;
  document.getElementById('lend-rate').textContent = rate>0 ? rate.toFixed(2)+'%' : '—';
  document.getElementById('lend-body').innerHTML = rows.map(r=>{
    const s = stockData.find(x=>x.code===r.code);
    const mv = s ? Math.round(r.shares*s.price) : 0;
    return `<tr>
      <td>${r.code}</td><td>${r.name}</td>
      <td>${r.shares.toLocaleString()}</td>
      <td>${r.date}</td>
      <td>${r.rate}</td>
      <td class="up">+${Math.round(r.income).toLocaleString()}</td>
      <td>${mv?mv.toLocaleString():'—'}</td>
    </tr>`;
  }).join('');
}

async function addLending() {
  const st=document.getElementById('st3'), pb=document.getElementById('prog3');
  const code=(document.getElementById('l-code').value||'').trim().toUpperCase();
  const name=document.getElementById('l-name').value.trim()||code;
  const shares=+document.getElementById('l-shares').value;
  const date=document.getElementById('l-date').value;
  const rate=document.getElementById('l-rate').value||'0';
  const income=+document.getElementById('l-income').value||0;
  if(!code||!shares||!date){st.textContent='請填寫代號、股數、日期';st.className='status err';return;}
  lendData.push({code,name,shares,date,rate,income});
  pb.style.width='50%';
  try {
    await gasCall({action:'append',sheet:'lending',row:[code,name,shares,date,rate,income]});
    pb.style.width='100%';
    st.textContent='已新增借貸記錄 ✓'; st.className='status ok';
    ['l-code','l-name','l-shares','l-date','l-rate','l-income'].forEach(id=>document.getElementById(id).value='');
    renderLending();
  } catch(e) {
    pb.style.width='100%';
    st.textContent='本地新增成功（Sheets 寫入失敗：'+e.message+'）'; st.className='status';
  }
}

async function doSnap() {
  const st=document.getElementById('st1');
  if(!stockData.length){st.textContent='請先重新整理';st.className='status err';return;}
  let twV=0;
  stockData.forEach(s=>{if(s.mkt==='TW') twV+=s.sh*s.price;});
  const today=new Date().toISOString().split('T')[0];
  try {
    const res=await gasCall({action:'append',sheet:'snapshots',row:[today,+(twV/FX).toFixed(2),0,Math.round(twV)]});
    if(!res.ok) throw new Error(res.error);
    st.textContent='快照已儲存：'+today; st.className='status ok';
  } catch(e){st.textContent=e.message; st.className='status err';}
}

async function addStock() {
  const st=document.getElementById('st2'), pb=document.getElementById('prog2');
  const ticker=(document.getElementById('f-t').value||'').trim().toUpperCase();
  const mkt=document.getElementById('f-m').value;
  const sh=+document.getElementById('f-s').value;
  const cost=+document.getElementById('f-c').value;
  const price=+document.getElementById('f-p').value;
  const name=document.getElementById('f-n').value.trim()||ticker;
  if(!ticker||!sh||!cost||!price){st.textContent='請填寫所有欄位';st.className='status err';return;}
  st.textContent='讀取中...'; pb.style.width='20%';
  try {
    const res=await gasCall({action:'read',sheet:'holdings'});
    if(!res.ok) throw new Error(res.error);
    let rows=res.data.length?res.data:[['ticker','market','shares','avg_cost','current_price','name']];
    const idx=rows.findIndex((r,i)=>i>0&&String(r[0])===ticker);
    if(idx>=0) rows[idx]=[ticker,mkt,sh,cost,price,name];
    else rows.push([ticker,mkt,sh,cost,price,name]);
    pb.style.width='60%';
    const res2=await gasCall({action:'write',sheet:'holdings',rows});
    if(!res2.ok) throw new Error(res2.error);
    pb.style.width='100%';
    st.textContent=ticker+' 已寫入 ✓'; st.className='status ok';
    ['f-t','f-s','f-c','f-p','f-n'].forEach(id=>document.getElementById(id).value='');
    setTimeout(()=>refresh(),600);
  } catch(e){st.textContent=e.message; st.className='status err'; pb.style.width='0%';}
}

async function initSheets() {
  try {
    const res=await gasCall({action:'read',sheet:'snapshots'});
    if(res.ok && res.data.length<=1) {
      const rows=[['date','total_usd','us_usd','tw_twd'],...histInit];
      await gasCall({action:'write',sheet:'snapshots',rows});
    }
  } catch(e){}
  try {
    const res=await gasCall({action:'read',sheet:'lending'});
    if(res.ok && res.data.length>1) {
      lendData=res.data.slice(1).filter(r=>r[0]).map(r=>({
        code:String(r[0]),name:r[1],shares:+r[2],date:r[3],rate:r[4],income:+r[5]||0
      }));
    }
  } catch(e){}
}

refresh();
initSheets();
</script>
